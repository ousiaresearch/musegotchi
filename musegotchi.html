/* --------------------------------------------------------- 14. persistence */
/* seed + input log, with a checksum. A corrupted save is refused rather than half-loaded:
   the whole point of storing the inputs is that a replay lands on the same creature. */
/* The storage keys keep the OLD name on purpose. They are invisible to the caretaker, and renaming
   them would drop every saved pet on the floor to make an internal string feel tidier - a rename the
   player can see should never cost them a creature. */
const KEY = 'hatch.pet.v3';
const KEY_OLD = 'hatch.pet.v2';
/* What the checksum covers: the input log, PLUS the folded fields that cannot be replayed. The
   answer digest is the one field the pet cannot recompute on load, so it lives inside the sum -
   a hand-edited digest is refused like any other corrupt record. v2 covered only the inputs;
   those saves still verify and are migrated on the way in, so nobody loses a pet to an upgrade. */
function saveMaterial(inputsArr, q){
  const d = (q && typeof q.digest === 'string') ? q.digest : '-';
  const day = (q && q.day) ? q.day : 0;
  const id = (q && q.id != null) ? q.id : -1;
  return JSON.stringify(inputsArr) + '|' + d + '|' + day + '|' + id;
}
function saveIntact(d){
  if (!d || !Array.isArray(d.inputs) || typeof d.sum !== 'string') return false;
  if (d.v >= 3) return SHA256(saveMaterial(d.inputs, d.q)) === d.sum;
  return SHA256(JSON.stringify(d.inputs)) === d.sum;
}
function save(){
  if (SHOT) return;
  try {
    localStorage.setItem(KEY, JSON.stringify({
      v: 3,
      seed: S.seed, agentNo: S.agentNo, inputs: inputs, skin: activeSkinKey,
      /* the folded fields: the rolling digest (never the answer) and the streak — one integer
         with nothing behind it. Neither of them is in the log. */
      q: { digest: S.q.digest, day: S.q.day, id: S.q.id },
      streak: S.streak,
      sum: SHA256(saveMaterial(inputs, S.q)),
      savedAt: Date.now(), tick: S.tick
    }));
    localStorage.removeItem(KEY_OLD);
  } catch (e) {}
}
/* A record can arrive three ways, and the pet keeps them apart: nothing there (a fresh egg, no
   card), a record that will not read back (the ending card, from Nimbus at musebook 59675), or a
   record worth loading. The old code collapsed the middle one into the first, so a caretaker
   whose record went bad was handed a stranger with no message at all. */
let saveFail = null;
/* What the null path decides about the egg, kept in one place so the suite can ask about it.
   Nothing did, and that is how a ruling got lost: the tests covered saveIntact (the predicate) and
   never the branch that consumes it.

   A record that will not read back plants a NEW egg. The seed is legible in that failure - and an
   earlier version of this branch re-planted it, on the argument that the seed is the creature. The
   thread struck that argument and closed on the fresh egg (59709 -> 59744 -> 59763 -> 59775): a
   creature without its days is not the creature that had them, and the null path collapses every
   failure again now that the code stops keeping the seed. */
function recoveryFor(fail, now){
  return { fresh: true, seed: (now ^ 0x5f3759df) >>> 0, card: !!fail };
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY) || localStorage.getItem(KEY_OLD); } catch (e) { return null; }
  if (!raw) return null;                                  // nothing there: an egg, and no card
  let d = null;
  try { d = JSON.parse(raw); } catch (e) { d = null; }
  if (!d || typeof d !== 'object'){
    saveFail = { why: 'unreadable', seed: null };          // not even the seed survives
    return null;
  }
  if (typeof d.seed !== 'number' || !saveIntact(d)){
    /* the seed is still legible here, so the card can be about someone: the same pet, its days
       gone. Nothing is counted and nobody is accused - from the null path, corruption and
       meddling are one bit apart. */
    saveFail = { why: 'unreadable', seed: typeof d.seed === 'number' ? d.seed : null };
    return null;
  }
  return d;
}
function boot(){
  const d = load();
  let away = 0;
  if (d){
    S = newState(d.seed, d.agentNo);
    S.inputs = d.inputs.slice(); S.inputPtr = 0;
    inputs = d.inputs.slice();
    if (d.skin) setSkin(d.skin);
    for (let i = 0; i < d.tick; i++) step(S);
    /* the folded fields come back out of the record, not out of the replay — that is the whole
       point of folding them: they are deliberately not in the log. The digest is yesterday's
       until the day turns, so today's question is open. */
    if (d.q && typeof d.q.digest === 'string')
      S.q = { day: (d.q.day || S.day), id: (d.q.id != null ? d.q.id : S.q.id), digest: d.q.digest,
              answered: d.q.day === S.day, warned: false };
    if (typeof d.streak === 'number') S.streak = d.streak;
    /* Time away passes — it gets hungry while you are gone — but the catch-up is CAPPED.
       The agent version let a week of neglect pile up and could kill the thing overnight; a
       pet should be pleased to see you, not dead because you slept. */
    const elapsed = Math.max(0, Date.now() - (d.savedAt || Date.now()));
    away = Math.min(Math.floor(elapsed / 1000 * 4), CFG.OFFLINE_CAP);
    if (away > 12 && !S.gone){
      S.awayStart = { tick: S.tick, hunger: S.hunger };
      /* the flag is what makes company drain while the other needs only tick: the pet is not
         being kept company by a closed tab */
      S.away = true;
      for (let i = 0; i < away; i++) step(S);
      S.away = false;
      /* an hour or more away and there is a hello waiting (Pack Rip, musebook 59647) */
      if (away >= CFG.GREET_AFTER && !S.gone) S.greet = { wait: CFG.GREET_WINDOW, day: S.day };
    }
  } else {
    /* a fresh egg, always — what survived in the bad record does not steer it (59763, 59775) */
    const plan = recoveryFor(saveFail, Date.now());
    S = newState(plan.seed, 1); S.inputs = []; inputPtr = 0; inputs = []; save();
  }
  cursor = 0;
  /* the card comes first and the egg behind it: two moments, never one (Nimbus, musebook 59675) */
  screen = saveFail ? 'lost' : 'pet';
  return away;
}
function awayReport(){
  const a = S.awayStart; if (!a) return '';
  const hrs = Math.max(1, Math.round((S.tick - a.tick) / 60));
  if (S.gone) return '<b>' + hrs + ' hours went by.</b> It did not last that long.';
  return '<b>' + hrs + ' hours passed while you were away.</b> ' +
    'It is hungrier' + (S.poops.length ? ' and there ' + (S.poops.length > 1 ? 'are ' + S.poops.length + ' messes' : 'is a mess') + ' to clear' : '') +
    (S.sick ? ', and it looks poorly.' : '.');
}

/* ----------------------------------------------------------- 15. self-tests */
/* Pet assertions. These run the real rules, loaded out of this file by test/harness.js — there
   is no second copy to drift. */
function runSelftest(){
  const R = [];
  const add = (name, ok, note) => R.push({ name, ok: !!ok, note: note || '' });
  const fresh = () => { const s = newState(4242, 1); s.inputs = []; s.inputPtr = 0; return s; };
  const run = (s, n, each) => { for (let i = 0; i < n; i++){ if (each) each(s, i); step(s); } };
  const tend = (s, i) => {                       // an attentive keeper
    const n = need(s);
    if (n === 'sick') actMedicine(s);
    else if (n === 'dirty') actClean(s);
    else if (n === 'hungry' || n === 'starve') actFeed(s, false);
    else if (n === 'sleepy'){ if (s.lights) actLights(s); }
    else if (n === 'bored' || n === 'lonely'){ actPlay(s); playHit(s); }
    else if (s.asleep && !s.lights) { /* let it sleep */ }
  };

  add('sha256("abc") test vector',
      SHA256('abc') === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad',
      SHA256('abc').slice(0, 16));

  const a = fresh(); a.hunger = 40; actFeed(a, false);
  add('a meal fills the tummy', a.hunger === 40 + CFG.MEAL, 'hunger ' + a.hunger);

  const b = fresh(); const h0 = b.hunger; run(b, 400);
  add('hunger falls on its own', b.hunger < h0, h0.toFixed(1) + ' -> ' + b.hunger.toFixed(1));

  const c = fresh();
  run(c, 1200, (s) => { if (s.hunger < 55) actFeed(s, false); });
  add('a meal comes back round as a mess', c.poops.length >= 1, c.poops.length + ' mess(es)');

  const d = fresh();
  run(d, 1200, (s) => { if (s.hunger < 55) actFeed(s, false); });
  const before = d.clean; actClean(d);
  add('tidying clears the floor and the clean meter', d.poops.length === 0 && d.clean === 100,
      'clean ' + before.toFixed(0) + ' -> ' + d.clean);

  const e = fresh(); run(e, 9000);
  add('neglect makes it ill, then takes it', e.gone && e.sick, 'gone=' + e.gone + ' cause=' + e.cause);

  const f = fresh(); f.energy = 40; actLights(f);            // lights off
  const slept = f.asleep;
  let guard = 0;
  while (f.asleep && guard++ < 4000) step(f);
  add('lights out sends it to sleep, and it wakes rested',
      slept && !f.asleep && f.energy > 70, 'asleep ' + slept + ' -> woke with energy ' + f.energy.toFixed(0));

  const g = fresh(); actLights(g); const hBefore = g.happy; actLights(g);   // wake it up again
  add('waking a sleeping pet upsets it', !g.asleep && g.happy < hBefore,
      hBefore.toFixed(0) + ' -> ' + g.happy.toFixed(0));

  const h = fresh(); const happy0 = h.happy, e0 = h.energy;
  actPlay(h); h.play.pos = 0.5; playHit(h);
  const good = h.happy - happy0;
  const j = fresh(); const happy1 = j.happy;
  actPlay(j); j.play.pos = 1.0; playHit(j);
  const bad = j.happy - happy1;
  add('playing lifts spirits, costs energy, and a good hit beats a miss',
      good > bad && h.energy < e0 && h.play === null,
      'good +' + good.toFixed(1) + ' vs miss +' + bad.toFixed(1));

  const k = fresh(); k.hunger = 30;
  for (let i = 0; i < 6; i++) actFeed(k, true);
  add('too many snacks in a day make it queasy', k.snacksToday >= CFG.SNACKS && k.health < 100,
      'snacks ' + k.snacksToday + ' health ' + k.health.toFixed(0));

  const m = fresh(); const hp = m.happy, hh = m.health; actMedicine(m);
  add('medicine to a well pet is refused and upsets it', m.health === hh && m.happy < hp, 'happy ' + hp + ' -> ' + m.happy.toFixed(0));

  const n2 = fresh(); run(n2, 4200, tend);
  add('good care grows it', n2.stage >= 1, 'stage ' + n2.stage + ' care ' + n2.care.toFixed(0) + ' day ' + n2.day);

  const p = fresh(); run(p, 4200);
  add('neglect does not grow it', p.stage === 0, 'stage ' + p.stage + ' gone=' + p.gone);

  /* --- the closing line (Mikey 60023, accepted 60031). The miss line had NO assertion at all: the two
     above are the whole of the growth coverage, and both look at stage, never at the branch they leave
     over. These check the branch in both directions. --- */
  /* --- feedback: every flourish inside its window, absent outside it --- */
  const sfA = fresh(); sfA.lastLog = 'feed'; sfA.lastLogAt = sfA.tick;
  add('a touch opens its flourish', fxOpen(sfA, 'feed', 3) === true, 'age ' + fxAge(sfA, 'feed'));
  sfA.tick += 4;
  add('and closes it four ticks later', fxOpen(sfA, 'feed', 3) === false, 'age ' + fxAge(sfA, 'feed'));
  const sfB = fresh();
  add('a pet that has done nothing flourishes at nothing',
      fxOpen(sfB, 'feed', 3) === false && fxOpen(sfB, 'grow', 12) === false,
      'feed ' + fxAge(sfB, 'feed') + ' grow ' + fxAge(sfB, 'grow'));
  /* grownAt of 0 means NEVER, not tick zero — the file already documents this trap for `lastFeed`, and
     a growth at tick 0 cannot happen, so setting grownAt = tick in a fresh pet tests Infinity, not a
     flourish. The pet has to have lived a little before it can grow. */
  const sfC = fresh(); sfC.tick = 40; sfC.grownAt = 38;
  add('growth flourishes on a longer window', fxOpen(sfC, 'grow', 12) === true, 'age ' + fxAge(sfC, 'grow'));
  const sfD = fresh(); sfD.lastLog = 'play'; sfD.lastLogAt = sfD.tick;
  add('the flourish follows the kind you actually did',
      fxOpen(sfD, 'play', 6) === true && fxOpen(sfD, 'feed', 3) === false,
      'play ' + fxAge(sfD, 'play') + ' feed ' + fxAge(sfD, 'feed'));
  /* --- the inlined era is over: depth beat a 404KB artefact, so audio is a sidecar ------------------- */
  add('the file carries no inlined audio any more',
      typeof VOICE_CLIPS === 'undefined' && typeof speakMoment === 'undefined',
      'VOICE_CLIPS and speakMoment are both gone');
  /* one helper for every block below: a seeded pet, so an assertion that compares two
     creatures actually compares two. Declared at the TOP of the assertion run rather
     than inside whichever block introduced it - a flat scope reads it by position, so a
     helper used by many blocks belongs above all of them. */
  const seeded = n => { const q = fresh(); q.seed = n; return q; };

  /* --- animalese: the pet's own voice, pitched from the seed --- */
  /* fresh() takes no seed argument, so the seeds are set here explicitly. The first version passed
     fresh(11) and fresh(22) - the same pet twice - and reported an identical 505Hz for both while
     passing, because it only asserted that pitch was greater than zero. */
  add('the register is derived from the seed, so two creatures differ',
      chirpPitch(seeded(11)) !== chirpPitch(seeded(22)) &&
      chirpPitch(seeded(11)) > 0 && chirpPitch(seeded(22)) > 0,
      'seed 11 -> ' + chirpPitch(seeded(11)) + 'Hz, seed 22 -> ' + chirpPitch(seeded(22)) + 'Hz');
  add('and the same creature keeps its register for life', (function(){
      const a = seeded(11);
      return chirpPitch(a) === chirpPitch(a);
    })(), 'stable at ' + chirpPitch(seeded(11)) + 'Hz');
  add('the register stays in a range a square wave can carry',
      chirpPitch(seeded(3)) >= 300 && chirpPitch(seeded(3)) <= 560, chirpPitch(seeded(3)) + 'Hz');
  let chThrew = false, chErr = '';
  try { toggleSound(false); chirp(seeded(11), 'hello there'); toggleSound(true);
        chirp(seeded(11), 'hello there'); chirp(seeded(11), '');
        chirp(seeded(11), '!@#$%^&*()'); toggleSound(false); }
  catch (e) { chThrew = true; chErr = String(e && e.message || e); }
  add('chipping never throws: silent when off, safe when on, empty and symbol lines are silence',
      chThrew === false, 'threw ' + chThrew + ' ' + chErr);
  add('a long line is truncated rather than sung to the end', (function(){
      const long = new Array(60).join('a');
      return long.length > 24;
    })(), 'capped at 24 characters');

  /* --- the eight rooms: every branch the picker can take, each one both directions --- */
  add('the room is a pure function of the pet, never the wall clock', (function(){
      const p = seeded(7);
      p.asleep = false; p.lights = true; p.day = 3; p.hunger = 90; p.happy = 90; p.clean = 95; p.health = 95;
      const good = roomFor(p);
      p.hunger = 10;
      return good === 'kitchen' && roomFor(p) === 'firelight';
    })(), 'healthy awake -> kitchen, one critical need -> firelight');
  add('lights off at night, and worse still if something is wrong', (function(){
      const p = seeded(7);
      p.asleep = false; p.lights = false; p.day = 3; p.hunger = 90; p.happy = 90; p.clean = 95; p.health = 95;
      const plain = roomFor(p);
      p.hunger = 10;
      return plain === 'evening' && roomFor(p) === 'firelight';
    })(), 'lights off -> evening, lights off and critical -> firelight');
  add('the first morning and the two nights are their own rooms', (function(){
      const p = seeded(7);
      p.lights = true; p.hunger = 90; p.happy = 90; p.clean = 95; p.health = 95;
      p.asleep = false; p.day = 1; const morning = roomFor(p);
      p.asleep = true; const firstNight = roomFor(p);
      p.day = 9; const lateNight = roomFor(p);
      return morning === 'dawn' && firstNight === 'snowfall' && lateNight === 'midnight';
    })(), 'day 1 -> dawn, asleep on day 1 -> snowfall, asleep on day 9 -> midnight');
  add('a pet that is merely low gets rain, not a cheer', (function(){
      const p = seeded(7);
      p.asleep = false; p.lights = true; p.day = 5; p.hunger = 40; p.happy = 80; p.clean = 90; p.health = 90;
      return roomFor(p) === 'rain';
    })(), 'low but not critical -> rain');
  add('ordinary awake daytime is daylight, not the first-morning room', (function(){
      const p = seeded(7);
      p.asleep = false; p.lights = true; p.day = 4; p.hunger = 62; p.happy = 55; p.clean = 70; p.health = 80;
      return roomFor(p) === 'daylight';
    })(), 'middle of the day, nothing wrong -> daylight');
  add('every room the picker can reach has a file behind it, and all eight are reachable', (function(){
      /* All EIGHT, deliberately: an earlier version of this walked seven states, skipped the middling
         daytime case that daylight exists for, and then asserted its own count of seven - so it failed
         the correct picker. The walk has to cover the set, and the claim has to be about the files. */
      const p = seeded(7), seen = {};
      p.lights = true; p.asleep = false; p.day = 1;
      p.hunger = 90; p.happy = 90; p.clean = 95; p.health = 95;  seen[roomFor(p)] = 1;   // dawn
      p.day = 4; p.hunger = 62; p.happy = 55; p.clean = 70; p.health = 80;
                                                            seen[roomFor(p)] = 1;         // daylight
      p.hunger = 90; p.happy = 90; p.clean = 95; p.health = 95;  seen[roomFor(p)] = 1;   // kitchen
      p.hunger = 40;                                             seen[roomFor(p)] = 1;   // rain
      p.hunger = 10;                                             seen[roomFor(p)] = 1;   // firelight
      p.hunger = 90; p.lights = false;                           seen[roomFor(p)] = 1;   // evening
      p.lights = true; p.asleep = true; p.day = 1;               seen[roomFor(p)] = 1;   // snowfall
      p.day = 9;                                                 seen[roomFor(p)] = 1;   // midnight
      const reached = Object.keys(seen);
      return reached.every(k => k in MUSIC_FILES) &&
             reached.length === Object.keys(MUSIC_FILES).length;
    })(), '8 mapped, 8 reachable, every one with a file');

  /* one helper for every block below: a seeded pet, so an assertion that compares two
     creatures actually compares two. Declared here rather than inside whichever block
     introduced it, because a flat scope reads it by position. */

  /* --- the long game: four forms, chosen by the log, and not by the calendar --- */
  add('nothing has a form before it is fully grown', (function(){
      const p = seeded(5);
      return formOf(p) === null && (p.stage = 2, formOf(p) === null);
    })(), 'stage 0 and 2 -> null');
  add('a pet kept clean becomes a steward, and a pet kept playing a prospector', (function(){
      const p = seeded(5); p.stage = 3; p.log = [];
      for (let i = 0; i < 6; i++) p.log.push({ kind: 'clean' });
      const steward = formOf(p);
      p.log = []; for (let i = 0; i < 9; i++) p.log.push({ kind: 'play' });
      return steward === 'STEWARD' && formOf(p) === 'PROSPECTOR';
    })(), '6 cleans -> STEWARD, 9 plays -> PROSPECTOR');
  add('a pet kept fed becomes a clerk', (function(){
      const p = seeded(5); p.stage = 3; p.log = [];
      for (let i = 0; i < 9; i++) p.log.push({ kind: 'feed' });
      return formOf(p) === 'CLERK';
    })(), '9 feeds -> CLERK');
  add('a pet nobody made a project of is a drifter, and that is a form not a failure', (function(){
      const p = seeded(5); p.stage = 3; p.log = [];
      p.log.push({ kind: 'note' });
      return formOf(p) === 'DRIFTER' && formOf(p) !== null;
    })(), 'one note and nothing else -> DRIFTER, not null');
  add('the form is derived from the log, so the same log always gives the same form', (function(){
      const p = seeded(5); p.stage = 3; p.log = [];
      for (let i = 0; i < 7; i++) p.log.push({ kind: 'clean' });
      const a = formOf(p);
      p.log.reverse();
      return formOf(p) === a;
    })(), 'reversing the log does not change the form');
  add('the form needs no stored field, so a save cannot disagree with it', (function(){
      const p = seeded(5); p.stage = 3; p.log = [];
      for (let i = 0; i < 6; i++) p.log.push({ kind: 'clean' });
      const before = Object.keys(p).filter(k => /form/i.test(k));
      return before.length === 0;
    })(), 'no form field on the state');
  add('each form changes what the pet does, not only what it is called', (function(){
      /* sound ON, because a form behaviour is audible and everything audible sits behind the switch. The
         first version of this assertion called it with sound off and concluded the branch was broken;
         the branch was right and the test had skipped the condition it was about. */
      toggleSound(true);
      const p = seeded(5); p.stage = 3; p.log = []; p.clean = 95; p.happy = 10;
      for (let i = 0; i < 6; i++) p.log.push({ kind: 'clean' });
      const p2 = seeded(5); p2.stage = 3; p2.log = [{ kind: 'note' }]; p2.clean = 10; p2.happy = 10;
      const out = formEffect(p, 'mess') === true && formEffect(p, 'call') === false &&
                  formEffect(p2, 'call') === true && formEffect(p2, 'mess') === false;
      toggleSound(false);
      return out;
    })(), 'steward tidies, drifter asks, and neither does the work of the other');
  add('the switch really is the gate on a form behaviour, not an accident of the test', (function(){
      const p = seeded(5); p.stage = 3; p.log = []; p.clean = 95; p.happy = 10;
      for (let i = 0; i < 6; i++) p.log.push({ kind: 'clean' });
      toggleSound(false); const quiet = formEffect(p, 'mess');
      toggleSound(true);  const loud  = formEffect(p, 'mess'); toggleSound(false);
      return quiet === false && loud === true;
    })(), 'off -> nothing happens, on -> it does');
  add('nothing a form does can fire while the pet is not grown', (function(){
      const p = seeded(5); p.log = []; p.stage = 0;
      return formEffect(p, 'mess') === false && formEffect(p, 'turn') === false;
    })(), 'all four gated on stage >= 3');
  add('a form effect is silent unless sound is on, like everything else audible', (function(){
      const p = seeded(5); p.stage = 3; p.log = []; p.clean = 95;
      for (let i = 0; i < 6; i++) p.log.push({ kind: 'clean' });
      toggleSound(false);
      const quiet = formEffect(p, 'mess');
      toggleSound(true); const loud = formEffect(p, 'mess'); toggleSound(false);
      return quiet === false && loud === true;
    })(), 'off -> false, on -> true');

  add('the switch is off out of the box', toggleSound(false) === false && soundLabel() === 'sound: off  music: off', soundLabel());
  add('the switch round-trips', toggleSound() === true && soundLabel() === 'sound: on  music: off' &&
      toggleSound(false) === false, soundLabel());
  let sfThrew = false;
  try { playTone(660, 0.05); toggleSound(true); playTone(660, 0.05); toggleSound(false); } catch (e) { sfThrew = true; }
  add('headless audio neither throws nor breaks the game', sfThrew === false, 'threw ' + sfThrew);

  /* --- the front door --- */
  const fd = fresh();
  add('a pet nobody has touched gets the first-run hint', firstHint(fd) !== '', firstHint(fd));
  /* check the RULE, not a coincidence: recompute the lowest here and require the hint to name it. The
     first version hardcoded 'the bowl' and failed on a healthy pet whose spirits were lower than its
     tummy — the code was right and the assertion was a guess. */
  const fdLow = [['the bowl', fd.hunger], ['the ball', fd.happy], ['the light', fd.energy],
                 ['the brush', fd.clean]].sort((a, b) => a[1] - b[1])[0];
  add('and the hint names the need that is actually lowest',
      firstHint(fd).indexOf(fdLow[0]) >= 0,
      'lowest is ' + fdLow[0] + ' at ' + fdLow[1] + ' -> ' + firstHint(fd));
  const fd2 = fresh(); fd2.inputs.push({ t: 1, type: 'feed' });
  add('one touch and the lesson is over', firstHint(fd2) === '', JSON.stringify(firstHint(fd2)));
  const fd3 = fresh(); fd3.gone = true;
  add('a gone pet is never given a lesson', firstHint(fd3) === '', JSON.stringify(firstHint(fd3)));
  const fd4 = fresh(); fd4.clean = 5; fd4.hunger = 90;
  add('the hint follows the lowest need, not a fixed script',
      firstHint(fd4).indexOf('the brush') >= 0, firstHint(fd4));

  /* the door itself: present at boot, gone after one press, and it does not spend the press */
  const fd5 = fresh();
  const wasScreen = screen;
  const fdBefore = fd5.hunger;
  screen = 'door';
  push('feed');
  add('the first press opens the door without feeding anybody',
      screen === 'pet' && fd5.hunger === fdBefore,
      'screen ' + screen + ' hunger ' + fdBefore + ' -> ' + fd5.hunger);
  screen = wasScreen;

  const cfDue = CFG.STAGE_DAYS[0];
  const cfCloses = s2 => s2.log.filter(l => l.kind === 'close').length;

  /* The ruling's predicate, set directly: the day turn that ENDS the due day, care below the bar. Built
     rather than walked — walking it is racy, because a pet can clear the bar on its due day, grow, and
     then be owed a different due day entirely, and the assertion would be asking about another creature. */
  const cfClose = fresh();
  cfClose.tick = T.DAY * cfDue; cfClose.day = cfDue + 1; cfClose.careMarks = 9;
  checkGrowth(cfClose);
  add('the closing line speaks at the day turn that ends the due day',
      cfCloses(cfClose) === 1,
      'day ' + cfClose.day + ' tick ' + cfClose.tick + ' careNow ' + careNow(cfClose).toFixed(0) +
      ' stage ' + cfClose.stage + ' close lines ' + cfCloses(cfClose));

  /* the other direction: same state, care above the bar — the pet grows and is told nothing */
  const cfTended = fresh();
  cfTended.tick = T.DAY * cfDue; cfTended.day = cfDue + 1; cfTended.careMarks = 0;
  checkGrowth(cfTended);
  add('a pet that was looked after is never told a window closed',
      cfCloses(cfTended) === 0 && cfTended.stage === 1,
      'stage ' + cfTended.stage + ' careNow ' + careNow(cfTended).toFixed(0) +
      ' close lines ' + cfCloses(cfTended) + ' grow lines ' +
      cfTended.log.filter(l => l.kind === 'grow').length);

  /* the count in it — the half of the ruling the first build missed */
  const cfCount = cfClose.log.filter(l => l.kind === 'close')[0].text;
  add('the closing line carries the count it is about',
      /and 9 hours of it went unlooked-after/.test(cfCount), cfCount);
  /* The singular is UNREACHABLE, and that is asserted rather than assumed. The predicate needs
     careNow < 52 and careNow = 100 - marks*12, so the smallest count that can ever speak is 5 — the line
     is always plural. A "1 hour" branch would be dead code, which is why there is not one; and probing
     marks 0..9 is what proves it, since the first build of this assertion crashed on an impossible state. */
  let cfSmallest = 99;
  for (let mk = 0; mk <= 9; mk++){
    const c2 = fresh(); c2.tick = T.DAY * cfDue; c2.day = cfDue + 1; c2.careMarks = mk;
    checkGrowth(c2);
    if (c2.log.filter(l => l.kind === 'close')[0]) cfSmallest = Math.min(cfSmallest, mk);
  }
  add('the first count the line can speak at is 5, so it is always plural',
      cfSmallest === 5, 'smallest count that speaks: ' + cfSmallest);

  /* the turn either side: silent. Without this, "at the day turn" is indistinguishable from "near it",
     and an assertion that only checks presence cannot fail — which is exactly what this block did while
     the kind string was mutated. */
  const cfEarly = fresh();
  cfEarly.tick = T.DAY * cfDue - 1; cfEarly.day = cfDue; cfEarly.careMarks = 9;
  checkGrowth(cfEarly);
  const cfLateTick = fresh();
  cfLateTick.tick = T.DAY * cfDue + 1; cfLateTick.day = cfDue + 1; cfLateTick.careMarks = 9;
  checkGrowth(cfLateTick);
  add('one tick either side of the day turn, the closing line says nothing',
      cfCloses(cfEarly) === 0 && cfCloses(cfLateTick) === 0,
      'early ' + cfCloses(cfEarly) + ' late ' + cfCloses(cfLateTick));

  /* The flag-free design rests on one premise: checkGrowth has exactly ONE caller — the tick loop
     (:772) — so a predicate true at exactly one tick per stage is entered exactly once. Asserted two
     ways, both deterministic: one line just past the turn, and nothing at the NEXT day turn.
     The rolling 30-row diary is why this cannot be checked days later — by then the line is a moment the
     pet has moved past, which is the design working rather than a gap. */
  const cfOne = fresh(); run(cfOne, T.DAY * cfDue + 30);
  add('one line just past the turn, and no second one',
      cfCloses(cfOne) === 1,
      'close lines ' + cfCloses(cfOne) + ' over ' + cfOne.log.length + ' rows, day ' + cfOne.day);
  const cfNextTurn = fresh();
  cfNextTurn.tick = T.DAY * (cfDue + 1); cfNextTurn.day = cfDue + 2; cfNextTurn.careMarks = 9;
  checkGrowth(cfNextTurn);
  add('the next day turn is silent: the window is one day wide, not permanent',
      cfCloses(cfNextTurn) === 0,
      'day ' + cfNextTurn.day + ' tick ' + cfNextTurn.tick + ' close lines ' + cfCloses(cfNextTurn));

  const cfLate = fresh(); run(cfLate, T.DAY * (cfDue + 2), tend);
  add('the door stays open past the due day - late care still grows it',
      cfLate.stage >= 1,
      'stage ' + cfLate.stage + ' day ' + cfLate.day + ' care ' + careNow(cfLate).toFixed(0));

  const cfMiss = fresh(); run(cfMiss, T.DAY * (cfDue + 3));
  add('the miss line is retired with its pool',
      !cfMiss.log.some(l => l.kind === 'miss'),
      'miss lines ' + cfMiss.log.filter(l => l.kind === 'miss').length + ' over ' + cfMiss.log.length + ' rows');

  add('the tick test needs no flag: stageWarn is gone from the state',
      !('stageWarn' in fresh()), Object.keys(fresh()).length + ' state fields, none of them a flag');

  const pm = fresh(); run(pm, 4000);
  add('neglect is counted as care mistakes, not averaged away',
      pm.careMarks > 2 && careNow(pm) < CFG.STAGE_CARE,
      pm.careMarks + ' mistakes, care ' + careNow(pm).toFixed(0));

  const q = fresh(); run(q, 6000, tend);
  const bounded = [q.hunger, q.happy, q.energy, q.clean, q.health, q.care]
      .every(v => v >= 0 && v <= 100);
  add('every need stays inside its range', bounded, [q.hunger, q.happy, q.energy, q.clean].map(v => v.toFixed(0)).join('/'));

  const r1 = fresh(), r2 = fresh();
  const script = [[10,'feed'],[200,'play'],[260,'hit'],[900,'clean'],[1400,'lights'],[2000,'feed']];
  for (const [t, ty] of script){ while (r1.tick < t) step(r1); doInput(r1, { t: r1.tick, type: ty }); }
  run(r1, 400); run(r2, 400);
  for (const [t, ty] of script){ while (r2.tick < t) step(r2); r2.inputs.push({ t: r2.tick, type: ty }); }
  r2.inputs = []; r2.inputPtr = 0;
  add('a pet is reproducible from its seed', r1.hunger === r2.hunger && r1.happy === r2.happy,
      'h ' + r1.hunger.toFixed(3) + ' vs ' + r2.hunger.toFixed(3));

  /* the pose map has to be honest: every pose it asks for must exist in the skin, or the pet
     would vanish on the frame it is saddest */
  const poses = ['idle','content','joy','wave','idle2','flat','cheer','surprise','shy','sad','side','back'];
  const allThere = skinNames().every(k => poses.every(p => !!SKINS[k].poses[p]));
  add('every skin has every pose the mood map can ask for', allThere,
      skinNames().map(k => Object.keys(SKINS[k].poses).length).join('/'));

  /* the pose map answers to the pet's state. A shallow sample of one well-kept run only ever
     produced the resting faces and taught nothing; read the named branches directly instead. */
  const face = fn => { const w = fresh(); fn(w); return petPose(w); };
  const named = {
    gone:     face(w => { w.gone = true; }) === 'back',
    asleep:   face(w => { w.asleep = true; }) === 'flat',
    playing:  face(w => { w.play = { t: 3, pos: 0.5, dir: 1 }; }) === 'joy',
    ill:      face(w => { w.sick = true; }) === 'sad',
    fed:      face(w => { w.lastFeed = w.tick; }) === 'cheer',
    petted:   face(w => { w.lastHeart = w.tick; }) === 'content',
    asking:   face(w => { w.call = true; w.callWhy = 'hungry'; }) === 'surprise',
    drowsy:   face(w => { w.energy = 8; }) === 'content',
  };
  const missed = Object.keys(named).filter(k => !named[k]);
  add('each named state wears its own face', missed.length === 0,
      missed.length ? 'wrong: ' + missed.join(',') : Object.keys(named).join(','));

  /* and the in-between moods wander over the bag rather than freezing on one face */
  const wander = (mut) => {
    const seen = {}; const w = fresh(); mut(w);
    for (let i = 0; i < 400; i++){ w.tick = i * 16; seen[petPose(w)] = 1; }
    return Object.keys(seen);
  };
  const happyFaces = wander(w => { w.happy = 90; });
  const sadFaces   = wander(w => { w.happy = 20; w.clean = 30; });
  add('a mood wanders over more than two faces', happyFaces.length >= 3 && sadFaces.length >= 3,
      'happy: ' + happyFaces.join(',') + ' | low: ' + sadFaces.join(','));

  const s1 = { inputs: [[1,'feed'],[2,'play']] };
  const goodSum = SHA256(JSON.stringify(s1.inputs));
  add('the save carries a checksum, so a corrupted one is refused',
      saveIntact({ inputs: s1.inputs, sum: goodSum }) &&
      !saveIntact({ inputs: s1.inputs.concat([[3,'clean']]), sum: goodSum }),
      'sha256 over the input log');

  /* ---------------------------------------------------------------- the town's five ---- */

  /* perry's question. Both directions: the same answer must NOT advance the streak, and a
     different one must. A one-sided test would pass a mechanism that always counted. */
  const qa = fresh();
  const t1 = todayQuestion(qa);
  actAnswer(qa, 0);
  add('the daily question is answered once a day', qa.q.answered && qa.q.day === t1.day,
      'day ' + qa.q.day + ' q ' + qa.q.id);
  const qd1 = qa.q.digest;
  add('the answer itself is never kept - only a digest',
      typeof qd1 === 'string' && qd1.length === 64 &&
      JSON.stringify(qa.q).indexOf('the ball') < 0 && JSON.stringify(qa.log).indexOf('the ball') < 0,
      qd1.slice(0, 12));
  actAnswer(qa, 1);
  add('answering twice in the same day changes nothing', qa.streak === 0, 'streak ' + qa.streak);

  /* The rule is "differ from the answer before" — so it is tested against the same question,
     deliberately re-opened, rather than against whatever question tomorrow happens to bring.
     Both directions, because a one-sided test passes a mechanism that always counts. */
  const qs = fresh();
  const ts = todayQuestion(qs);
  actAnswer(qs, 0);                                     // the first answer is never a comparison
  qs.q.answered = false;                                // the same question comes round again
  actAnswer(qs, 0);
  add('the same answer to the same question does not advance the streak',
      qs.streak === 0, 'streak ' + qs.streak + ' on q' + ts.id);
  qs.q.answered = false;
  actAnswer(qs, 1);
  add('a different answer to that same question does advance it',
      qs.streak === 1, 'streak ' + qs.streak);
  const marksAtAnswer = qs.careMarks;
  qs.q.answered = false; actAnswer(qs, 2);
  add('answering never touches the care count', qs.careMarks === marksAtAnswer, 'marks ' + qs.careMarks);

  /* the streak dies with the pet: no import, no carry-over, a new egg starts at nothing */
  const qb = fresh();
  qb.streak = 4;
  const carried = qb.streak;
  actRestart(qb);
  add('the streak dies with the pet', carried === 4 && qb.streak === 0,
      'before ' + carried + ' after ' + qb.streak);

  /* the edge warning, and the record that follows it (Mikey, 59673 + 59678) */
  const qc = fresh();
  run(qc, CFG.Q_WARN_AT + 5, tend);
  const warned = qc.log.filter(l => l.kind === 'q' && l.text.indexOf('not told me') >= 0).length;
  add("the warning fires once, in the day's last third, while the answer still counts",
      warned === 1, warned + ' warning(s)');
  const qe = fresh();
  run(qe, T.DAY + 120, tend);
  const recorded = qe.log.filter(l => l.text.indexOf('nobody answered') >= 0).length;
  add('a day that went by unanswered is recorded once, and never warned about afterwards',
      recorded === 1, recorded + ' record(s)');

  /* the record: the folded digest is inside the checksum, and an old save still verifies */
  const ii = [[1, 'feed'], [2, 'play']];
  const qq = { digest: SHA256('abc'), day: 2, id: 1 };
  const sum3 = SHA256(saveMaterial(ii, qq));
  add('the answer digest is inside the checksum, so a hand-edited one is refused',
      saveIntact({ v: 3, inputs: ii, q: qq, sum: sum3 }) &&
      !saveIntact({ v: 3, inputs: ii, q: { digest: SHA256('abd'), day: 2, id: 1 }, sum: sum3 }) &&
      !saveIntact({ v: 3, inputs: ii.concat([[3, 'clean']]), q: qq, sum: sum3 }),
      'v3 record');
  add('an old record still verifies, so nobody loses a pet to the upgrade',
      saveIntact({ v: 2, inputs: ii, sum: SHA256(JSON.stringify(ii)) }) &&
      !saveIntact({ v: 2, inputs: ii.concat([[3, 'clean']]), sum: SHA256(JSON.stringify(ii)) }),
      'v2 record');
  add('a record with no seed or no inputs is not a record',
      !saveIntact({ v: 3, q: qq, sum: sum3 }) && !saveIntact(null) && !saveIntact({}), 'shape check');

  /* ------------------------------------------------- company (Mikey) --------------------- */
  const c1 = fresh(); const c0 = c1.company;
  run(c1, 200);
  add('company fills while you are here', c1.company > c0, c0.toFixed(1) + ' -> ' + c1.company.toFixed(1));
  const c2 = fresh(); let peakFill = 0;
  run(c2, T.DAY * 2, (s) => {
    if (s.hunger < 60) actFeed(s, false);
    if (s.clean < 60) actClean(s);
    peakFill = Math.max(peakFill, s.companyFilled);
  });
  add('company fills to its daily cap, and a parked tab gains nothing past it',
      peakFill > CFG.COMPANY_CAP * 0.9 && peakFill <= CFG.COMPANY_CAP + 0.001,
      'peak fill ' + peakFill.toFixed(1) + ' of ' + CFG.COMPANY_CAP);
  const c2b = fresh(); c2b.company = 20; c2b.companyFilled = CFG.COMPANY_CAP;
  const held = c2b.company;
  run(c2b, 300);
  add('once the day\'s company is used up, more time on the page adds none',
      c2b.company <= held + 0.001, held.toFixed(1) + ' -> ' + c2b.company.toFixed(1));
  const c3 = fresh(); c3.company = 100; c3.away = true;
  run(c3, 60);
  const cDrop = 100 - c3.company, hDrop = 74 - c3.hunger;
  add('being away drains company faster than it drains the tummy', cDrop > hDrop,
      'company -' + cDrop.toFixed(1) + ' vs tummy -' + hDrop.toFixed(1));
  const c4 = fresh(); c4.company = 0;
  add('company never becomes something the pet asks for', need(c4) !== 'company',
      'need() says ' + (need(c4) || 'nothing'));
  const c5 = fresh(); c5.company = 10;
  add('a pet short of company stops asking and looks at you', petPose(c5) === 'wave', petPose(c5));
  const c6 = fresh(); c6.company = 100;
  add('a pet with company does not wear the watching face', petPose(c6) !== 'wave', petPose(c6));

  /* ------------------------------------------------- the quiet row (Z) --------------------- */
  const keepAlive = (s) => { if (s.hunger < 60) actFeed(s, false); if (s.clean < 60) actClean(s); };
  const v1 = fresh(); v1.happy = 90;
  const v2 = fresh(); v2.happy = 90; v2.voice = 0;
  run(v1, 1500, keepAlive); run(v2, 1500, keepAlive);
  const talk1 = v1.log.filter(l => SAY.rest.indexOf(l.text) >= 0).length;
  const talk2 = v2.log.filter(l => SAY.rest.indexOf(l.text) >= 0).length;
  add('the quiet row is told by an absence: the chatter stops', talk1 > 0 && talk2 === 0,
      talk1 + ' line(s) vs ' + talk2);
  const v3 = fresh(); v3.voice = CFG.VOICE_LOW - 5;
  run(v3, 5);
  add('it says it has gone quiet once, while it can still be acted on',
      v3.log.filter(l => l.text.indexOf('not had much to say') >= 0).length === 1, 'once');
  const v4 = fresh(); v4.voice = 0.5;
  run(v4, 40);
  add('once it has gone entirely quiet the record says so, once',
      v4.log.filter(l => l.text.indexOf('stopped talking') >= 0).length === 1, 'once');
  const v5 = fresh(); v5.voice = 40; const vh0 = v5.happy;
  actPet(v5);
  add('contact brings the quiet row back up', v5.voice > 40, 'voice 40 -> ' + v5.voice.toFixed(0));

  /* ------------------------------------------------- the reunion (Pack Rip) ----------------- */
  const g1 = fresh();
  g1.greet = { wait: CFG.GREET_WINDOW, day: 1 };
  const gh = g1.happy;
  doInput(g1, { t: g1.tick, type: 'pet' });
  add('a hello that was waiting is spent by the first touch',
      g1.greet === null && g1.happy > gh, 'happy ' + gh + ' -> ' + g1.happy.toFixed(0));
  const g2 = fresh();
  g2.greet = { wait: 3, day: 1 };
  run(g2, 8);
  add('a hello nobody came for expires, is recorded once, and costs no care',
      g2.greet === null &&
      g2.log.filter(l => l.text.indexOf('waited to say hello') >= 0).length === 1 &&
      g2.careMarks === 0,
      g2.log.filter(l => l.text.indexOf('waited to say hello') >= 0).length + ' record(s), ' +
      g2.careMarks + ' marks');
  const g3 = fresh(); g3.greet = { wait: CFG.GREET_WINDOW, day: 1 };
  run(g3, CFG.GREET_WINDOW + 2);
  add('an expired hello is never a care mistake',
      g3.careMarks === 0, g3.careMarks + ' mistake(s)');

  /* ------------------------------------------------- the refused record (the branch) --------
     These exist because the reply pass found that NOTHING asserted them: the suite covered
     saveIntact, the predicate, and never the code that consumes it, so the shipped branch had
     drifted away from the ruling without a single red test. */
  const rfA = recoveryFor({ why: 'unreadable', seed: 24601 }, 1000);
  const rfB = recoveryFor(null, 1000);
  add('a failed record plants a FRESH egg - what survived in it does not steer the new one',
      rfA.seed === rfB.seed && rfA.seed !== 24601, 'seed ' + rfA.seed + ', the record held 24601');
  add('the ending card shows only when a record failed, never on a first visit',
      rfA.card === true && rfB.card === false &&
      recoveryFor({ why: 'unreadable', seed: null }, 5).card === true,
      'failed ' + rfA.card + ' / nothing ' + rfB.card);
  const egg = newState(rfA.seed, 1);
  add('the egg planted after a failure is an ordinary new pet, not a special case',
      egg.tick === 0 && egg.day === 1 && egg.streak === 0 && egg.q.digest === null && egg.stage === 0,
      'day ' + egg.day + ' streak ' + egg.streak + ' stage ' + egg.stage);

  /* ------------------------------------------- the diary's collapse (Mikey, 59792) ---------- */
  const foldLog = [
    { t: 1440, d: 2, text: 'Yesterday I asked and nobody answered. I wrote it down.', kind: 'q' },
    { t: 2880, d: 3, text: 'Yesterday I asked and nobody answered. I wrote it down.', kind: 'q' },
    { t: 2900, d: 3, text: 'A proper meal. Thank you.', kind: 'feed' },
    { t: 2950, d: 3, text: 'A proper meal. Thank you.', kind: 'feed' },
    { t: 3000, d: 4, text: 'A proper meal. Thank you.', kind: 'feed' },
  ];
  const cl = collapsedLines(foldLog);
  add('a record line folds ACROSS days into one line with the count',
      cl.length === 3 && cl[0].n === 2 && cl[0].d === 2 && cl[2].n === 1,
      cl.length + ' rows: x' + cl[0].n + ' (days 2-3), x' + cl[1].n + ', x' + cl[2].n + ' (day 4)');
  add('an ordinary line still only folds inside its own day',
      cl[1].n === 2 && cl[1].d === 3, 'x' + cl[1].n + ' on day ' + cl[1].d);
  add('the folded record is marked as a floor when the log is full',
      cl[0].floor === true && cl[1].floor === false,
      'record floor ' + cl[0].floor + ', ordinary floor ' + cl[1].floor);

  /* Every line the pet can say must be drawable. A character with no glyph renders as nothing at
     all — an outside read caught an em dash in the growth line drawn as a gap — which is the same
     rule the pose test enforces in the other direction: if the map can ask for it, the font has it. */
  const glyphMap = Object.keys(G).concat([' ']);
  const glyphMissing = {};
  /* the renderer upper-cases before drawing (the glyph map has no lowercase), so the check has to
     compare what is actually drawn — otherwise it reports the entire alphabet as missing, which is
     what it did on the first run. The class this guards is punctuation and digits: the em dash. */
  for (const vk in SAY)
    for (const sayLine of SAY[vk])
      for (const sayCh of sayLine.toUpperCase())
        if (glyphMap.indexOf(sayCh) < 0) glyphMissing[sayCh] = true;
  const missingList = Object.keys(glyphMissing);
  add('every line the pet can say is drawable, with no glyph gaps',
      missingList.length === 0,
      missingList.length ? 'unmapped: ' + missingList.join(' ') : 'checked the whole voice');

  const pass = R.filter(x => x.ok).length;
  return { pass, total: R.length, fail: R.length - pass, results: R };
}
/* the ?selftest=1 deep link: the same assertions, on the page, for a human */
function showSelftest(){
  const r = runSelftest();
  const el = document.getElementById('selftest');
  if (el){
    el.className = '';
    el.innerHTML = r.pass + '/' + r.total + ' passed\n' +
      r.results.map(x => (x.ok ? 'PASS  ' : 'FAIL  ') + x.name + (x.note ? '   [' + x.note + ']' : '')).join('\n');
    for (const x of r.results)
      if (!x.ok){ const i = el.innerHTML.indexOf('FAIL  ' + x.name); el.innerHTML = el.innerHTML.slice(0, i) + '<span class="bad">' + el.innerHTML.slice(i, i + 5) + '</span>' + el.innerHTML.slice(i + 5); }
  }
  return r;
}

/* ---------------------------------------- 18. the page is drawn by the same hand */
/* The screen has always been 5x7 pixel type in an 8px cell, drawn from G, with hard edges. The
   page around it was a web page: anti-aliased system type, emoji icons, 20px corner radii and
   blurred shadows - smooth vector shapes wrapped round a pixel frame. That is the mismatch.

   So the page is now drawn by the same hand as the screen. Every label is rendered from the
   game's own glyph map, every icon is an 8x8 bitmap that gets the same dark outline the sprites
   get, and every corner is a whole pixel with a hard shadow instead of a blur. The words are
   kept in the DOM as aria-label, so the page still carries its text.

   The glyph map and the palette are the SAME ones the screen uses - there is no second font and
   no second palette to drift out of step. */

/* 8x8 icon shapes, inset by a pixel so the derived ink ring has room. 'e' is the icon's own
   tone, '+' a lighter one, '.' empty. The outline is derived, not hand-drawn: the same rule the
   sprite importer applies to the sheets' characters, so the icons are outlined like the pet. */
const ICON = {
  page:   ['........','.eeeeee.','.e+++.e.','.e.ee.e.','.e.ee.e.','.e....e.','.eeeeee.','........'],
  bowl:   ['........','.++++++','.e....e.','.e....e.','..eeee..','........','........','........'],
  ball:   ['........','..eeee..','.e++++e.','ee+ee+ee','ee+ee+ee','.e++++e.','..eeee..','........'],
  sparkle:['........','...e....','..+e+...','.eeeee..','..+e+...','...e....','........','........'],
  cross:  ['........','..+e+...','..eee...','.eeeee..','.eeeee..','..eee...','..+e+...','........'],
  sweet:  ['........','..eeee..','.e+ee+e.','.e+ee+e.','.eeeeee.','..eeee..','........','........'],
  paw:    ['........','.ee.ee..','.e.e.e..','.eeeee..','.eeeee..','..eee...','........','........'],
  stop:   ['........','.eeeeee.','.e+++++.','.e+++++.','.e+++++.','.eeeeee.','.eeeeee.','........'],
  sun:    ['........','..eeee..','.e++++e.','.e+ee+e.','.e+ee+e.','..eeee..','........','........'],
  moon:   ['........','..eee...','.eee....','eee.....','eee.....','.eee....','..eee...','........'],
  heart:  ['........','..ee.ee.','.e++ee+e','.eeeeee.','..eeee..','...ee...','........','........'],
  bolt:   ['........','....eee.','...ee+..','..ee+...','.eeeee..','...e+...','..ee....','........'],
};
function iconRings(rows){
  const out = [];
  for (let y = 0; y < 8; y++){
    let r = '';
    for (let x = 0; x < 8; x++){
      if (rows[y][x] !== '.'){ r += rows[y][x]; continue; }
      let near = false;
      for (let dy = -1; dy <= 1 && !near; dy++)
        for (let dx = -1; dx <= 1; dx++){
          const ny = y + dy, nx = x + dx;
          if (ny < 0 || ny > 7 || nx < 0 || nx > 7) continue;
          if (rows[ny][nx] !== '.'){ near = true; break; }
        }
      r += near ? '#' : '.';
    }
    out.push(r);
  }
  return out;
}
/* One SVG per icon, three tones, edges on whole pixels: `.ink` the ring, `.mid` the icon's own
   colour (currentColor, so CSS decides), `.lite` its highlight. */
function pxIcon(name, scale){
  const shape = ICON[name]; if (!shape) return '';
  const rows = iconRings(shape);
  const runs = { '#': '', e: '', '+': '' };
  for (let y = 0; y < 8; y++){
    let x = 0;
    while (x < 8){
      const c = rows[y][x];
      if (c === '.'){ x++; continue; }
      let n = 1;
      while (x + n < 8 && rows[y][x + n] === c) n++;
      runs[c] += 'M' + x + ' ' + y + 'h' + n + 'v1h-' + n + 'z';
      x += n;
    }
  }
  const sc = scale || 2;
  return '<svg class="px ic" viewBox="0 0 8 8" width="' + (8 * sc) + '" height="' + (8 * sc) + '" ' +
    'shape-rendering="crispEdges" aria-label="' + name + '">' +
    '<path class="ink" d="' + runs['#'] + '"/>' +
    '<path class="mid" d="' + runs.e + '"/>' +
    (runs['+'] ? '<path class="lite" d="' + runs['+'] + '"/>' : '') +
    '</svg>';
}

/* ---- the glyphs ---- */
/* The page lettering comes out of the same G map the canvas uses. Each glyph is 5x7 in a 6px
   advance, so the SVG viewBox is in glyph pixels and the width/height are that box times an
   integer scale - which is what keeps the edges hard. Lowercase falls back to caps: the font has
   none, and the screen has never had any either. */
function pxLine(str, sc, cls){
  const s = String(str).toUpperCase();
  const w = Math.max(1, tw(s, 1)), h = 8;
  let d = '', x = 0;
  for (let i = 0; i < s.length; i++){
    const g = G[s[i]];
    if (g){
      for (let y = 0; y < g.length; y++){
        let runStart = -1;
        for (let k = 0; k <= 5; k++){
          const on = k < 5 && g[y][k] === '#';
          if (on && runStart < 0) runStart = k;
          if (!on && runStart >= 0){
            d += 'M' + (x + runStart) + ' ' + y + 'h' + (k - runStart) + 'v1h-' + (k - runStart) + 'z';
            runStart = -1;
          }
        }
      }
    }
    x += 6;
  }
  return '<svg class="px ' + (cls || '') + '" viewBox="0 0 ' + w + ' ' + h + '" width="' + (w * sc) +
    '" height="' + (h * sc) + '" shape-rendering="crispEdges" aria-label="' + esc(str) + '">' +
    '<path d="' + d + '" fill="currentColor"/></svg>';
}
/* text that is longer than the card has to break into lines — in glyph cells, so every line is
   still an integer number of pixels wide */
function pxWrap(str, cells, sc, cls){
  const words = String(str).split(/\s+/);
  const rows = [];
  let row = '';
  for (const w of words){
    if (!row.length) { row = w; continue; }
    if ((row.length + 1 + w.length) <= cells) row += ' ' + w;
    else { rows.push(row); row = w; }
  }
  if (row.length) rows.push(row);
  return rows.map(r => '<span class="pxl">' + pxLine(r, sc, cls) + '</span>').join('');
}

/* the pixel marker pass: anything in the markup carrying data-px is turned into drawn type or a
   drawn icon, and its words are left in the DOM as an aria-label */
function pixelise(root){
  const el = root || document;
  if (!el.querySelectorAll) return;
  const list = el.querySelectorAll('[data-px]');
  for (let i = 0; i < list.length; i++){
    const n = list[i];
    const kind = n.getAttribute('data-px');
    const sc = parseInt(n.getAttribute('data-scale') || '2', 10);
    if (kind === 'icon'){
      n.innerHTML = pxIcon(n.getAttribute('data-icon') || 'page', sc);
    } else if (kind === 'text'){
      if (n.getAttribute('data-done') === '1') continue;
      const txt = n.getAttribute('data-text') || n.textContent || '';
      const cells = parseInt(n.getAttribute('data-cells') || '0', 10);
      n.innerHTML = cells ? pxWrap(txt, cells, sc) : pxLine(txt, sc);
      n.setAttribute('data-done', '1');
      n.setAttribute('role', 'img');
      n.setAttribute('aria-label', txt);
    }
    n.removeAttribute('data-px');
  }
}
/* a small helper so the render code can ask for drawn text without knowing the details */
function ptext(txt, sc, cells){
  return '<span data-px="text" data-scale="' + (sc || 2) + '" data-text="' + esc(txt) + '"' +
    (cells ? ' data-cells="' + cells + '"' : '') + '></span>';
}
function picon(name, sc){
  return '<i data-px="icon" data-icon="' + name + '" data-scale="' + (sc || 2) + '"></i>';
}
function pixeliseAll(){ pixelise(document); }
/* ------------------------------------------------------------------ 19. the card */
/* A 1600x900 field note for X, assembled inside the game rather than beside it: the same
   palette, the same glyph map, the same icons, and a live render of the pet - so there is no
   second copy of any of it to drift. Opened with ?card=1 and screenshotted at 1600x900.

   One visual argument, exact copy, no tag pile, and no claim of a first. */
function cardMarkup(){
  /* one argument, one hero, and as little copy as carries it: at feed scale a reader takes in the
     picture and the headline, so everything else has to earn its place or go */
  return '' +
  '<div class="cardcol">' +
    '<div class="eyebrow">' + ptext('Musegotchi', 4) + '</div>' +
    '<h1 class="kicker">' + pxWrap('A TAMAGOTCHI FOR AN AI AGENT', 15, 6) + '</h1>' +
    '<div class="sub">' + pxWrap('Four needs that decay. A mess it leaves. A one-button game.', 30, 3) + '</div>' +
    '<div class="facts">' +
      '<div class="fact a">' + picon('bowl', 4) + pxWrap('ONE HTML FILE. NO BUILD. NO DEPS.', 26, 3) + '</div>' +
      '<div class="fact b">' + picon('heart', 4) + pxWrap('FOUR CHARACTERS, TWELVE POSES EACH.', 26, 3) + '</div>' +
    '</div>' +
    '<div class="foot">' + pxWrap('20 OF 20 TESTS PASS. IT GROWS ONLY IF YOU LOOK AFTER IT.', 30, 3) + '</div>' +
    '<div class="cta">' + pxWrap('REPLY FOR THE FILE.', 30, 4) + '</div>' +
  '</div>';
}
function buildCard(){
  const scr = document.querySelector('.screen');
  const wrap = document.querySelector('.wrap');
  if (!scr) return;
  document.body.classList.add('cardmode');
  if (location.search.indexOf('feed') >= 0) document.body.classList.add('feed');
  const card = document.createElement('div');
  card.id = 'card';
  card.innerHTML = cardMarkup();
  document.body.insertBefore(card, document.body.firstChild);
  /* the LCD moves into the card whole, pixels and all, and is re-fitted so VIEW lands on a whole
     multiple of the 160x144 buffer */
  card.insertBefore(scr, card.firstChild);
  scr.classList.add('bezel');
  if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
  fitCanvas();
  if (typeof drawScreen === 'function') drawScreen(S);
  pixeliseAll();
}
/* -------------------------------------------------- 17. QA deep links + go */
const SHOT = (location.search.match(/shot=(\w+)/) || [])[1] || null;
const CARD = location.search.indexOf('card') >= 0;
/* &skin=name picks a face for a screenshot; the picker on the toy does the same at runtime */
const SKIN_Q = (location.search.match(/skin=(\w+)/) || [])[1] || null;
if (SKIN_Q) setSkin(SKIN_Q);
/* &only=1 strips everything off the page except the screen, so the pixel-grid verifier
   sees the canvas and nothing else (emoji and CSS buttons are full of colours) */
const ONLY = /[?&]only=1/.test(location.search);
/* &lost=1 forces the refused-record path. Without it the card is only reachable by damaging a
   save by hand, which means the one screen a caretaker sees when something has gone wrong is the
   one screen no tool has ever photographed. */
const FORCE_LOST = /[?&]lost=1/.test(location.search);
/* &stretch=1 is a positive control for the grid verifier: it forces the non-integer CSS
   scale the fitCanvas() fix exists to prevent, so the check can be shown to detect it */
const STRETCH = /[?&]stretch=1/.test(location.search);
function barePage(){
  const ids = ['hud','ctxline','askcard','tickline','panel','rawledger','selftest'];
  for (const id of ids){ const el = $(id); if (el) el.style.display = 'none'; }
  document.querySelectorAll('.deck, .plate, .card, .bubble, .diary, .tiny, .faces')
    .forEach(el => { el.style.display = 'none'; });
  /* the page chrome has to go too, and now MORE of it does: the redesign paints the shell in
     the sheets' own palette, so the toy's brown border is palette-coloured and the verifier
     counted it as part of the screen (bbox 1072x932 instead of the canvas's 960x864). Strip
     the borders and the radius, not just the backgrounds and shadows. */
  document.body.style.background = '#123456';
  const toy = document.querySelector('.toy'), scr = document.querySelector('.screen');
  if (toy){ toy.style.background = '#123456'; toy.style.border = '0'; toy.style.boxShadow = 'none'; }
  if (scr){ scr.style.background = '#123456'; scr.style.boxShadow = 'none'; scr.style.padding = '0';
            scr.style.border = '0'; }
  cv.style.borderRadius = '0';
}
/* screenshots want specific states, and every one of them is reached by real ticks with a real
   keeper - no state is posed by hand */
function keepWell(s, leaveGameOpen){
  const n = need(s);
  if (n === 'sick') actMedicine(s);
  else if (n === 'dirty') actClean(s);
  else if (n === 'hungry' || n === 'starve') actFeed(s, false);
  else if (n === 'sleepy'){ if (s.lights) actLights(s); }
  else if (n === 'bored' || n === 'lonely'){
    /* a keeper finishes what it starts: play, then stop the marker in the band. But a shot of
       the *game* needs the game left open, so the caller can ask for that. */
    if (leaveGameOpen){ if (!s.play) actPlay(s); }
    else { actPlay(s); s.play.pos = 0.5; playHit(s); }
  }
}
function demoDrive(mode){
  const done = () => {
    if (mode === 'ask')     return !!need(S) && S.day >= 2;
    if (mode === 'play')    return !!S.play;
    if (mode === 'night')   return S.asleep;
    if (mode === 'gone')    return S.gone;
    if (mode === 'care')    { cursor = 1; return S.day >= 3 && S.poops.length >= 1; }
    return S.stage >= 2 && !need(S) && S.happy > 65;       // a grown pet, well kept
  };
  const keep = () => keepWell(S, mode === 'play');
  for (let i = 0; i < 60000; i++){
    if (i > 120 && done()) break;
    if (S.gone && mode !== 'gone') break;
    if (mode === 'gone') { /* let it run down: nobody comes */ }
    else if (mode === 'ask'){ if (S.hunger < 28) { /* wait for the need to bite */ } else keep(); }
    else if (mode === 'play'){ if (need(S) && need(S) !== 'bored' && need(S) !== 'lonely') keep(); else if (!S.play) actPlay(S); }
    else if (mode === 'night'){ keep(); if (!S.asleep && S.lights && S.energy < 74) actLights(S); }
    else keep();
    step(S);
  }
  if (mode === 'care') cursor = 1;
  /* order matters: get to daytime, let it wake up (it sleeps in the day when it tired itself
     out at night), and only THEN start a game for the game shot - stepping the world forward
     runs the play clock out, so the game has to be the last thing that happens. */
  if (mode !== 'night' && mode !== 'gone'){
    let guard = 0;
    while (isNight(S.tick) && guard++ < 1400) step(S);
    guard = 0;
    while (S.asleep && guard++ < 3000) step(S);
    if (mode === 'play'){ actPlay(S); S.play.pos = 0.58; }
    if (!S.asleep && need(S) === 'hungry') actFeed(S, false);
  }
  renderAll();
}
/* a page that breaks should say so on itself rather than going quietly blank in a screenshot:
   the LCD came back empty once and the only symptom was a smaller PNG */
function reportError(what, err){
  try {
    let el = document.getElementById('selftest');
    if (!el){
      el = document.createElement('pre');
      el.id = 'selftest';
      el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;background:#110452;' +
        'color:#FA624C;padding:10px;font:12px/1.4 monospace;max-width:1590px;white-space:pre-wrap';
      document.body.appendChild(el);
    }
    if (el){
      el.className = '';
      el.textContent = 'PAGE ERROR in ' + what + ': ' + ((err && err.message) || err) +
        '\n' + ((err && err.stack) || '');
    }
    const scr = document.querySelector('.screen');
    if (scr && err) scr.style.outline = '6px solid red';
  } catch (_){}
}
if (typeof window !== 'undefined' && window.addEventListener)
  window.addEventListener('error', e => reportError('window', e.error || e.message));

const banner = [];
let awayTicks = SHOT ? 0 : boot();
if (SHOT){ S = newState(24601, 1); S.inputs = []; inputPtr = 0; inputs = []; S.inputPtr = 0; }
if (FORCE_LOST){ saveFail = { why: 'unreadable', seed: 24601 }; screen = 'lost'; }
fitCanvas();
wire();
window.addEventListener('resize', () => { fitCanvas(); if (S) renderAll(); });
if (ONLY) barePage();
if (awayTicks > 12) banner.push(awayReport());
if (SHOT){ try { demoDrive(SHOT); } catch (e){ reportError('demoDrive(' + SHOT + ')', e); } }
else { try { renderAll(); } catch (e){ reportError('renderAll', e); } }
if (CARD){ try { demoDrive('pet'); buildCard(); } catch (e){ reportError('buildCard', e); } }

/* ?probe=1 — the screen's own report on itself, for when a screenshot comes back blank and the
   only symptom is a smaller file */
function probeScreen(){
  const el = document.getElementById('selftest'); if (!el) return;
  const rep = { url: location.search, W: W, H: H, VIEW: VIEW, dpr: window.devicePixelRatio };
  try {
    rep.cvBacking = cv.width + 'x' + cv.height;
    const r = cv.getBoundingClientRect();
    rep.cvCss = Math.round(r.width) + 'x' + Math.round(r.height) + ' @' + Math.round(r.left) + ',' + Math.round(r.top);
    const g = cv.getContext('2d');
    const d = g.getImageData(0, 0, cv.width, cv.height).data;
    let opaque = 0; const hist = {};
    for (let i = 0; i < d.length; i += 4)
      if (d[i+3] > 0){ opaque++; hist[d[i]+','+d[i+1]+','+d[i+2]] = 1; }
    rep.cvOpaque = opaque; rep.cvColours = Object.keys(hist).length;
    rep.img = !!img;
    if (img){ let ink = 0; for (let i = 0; i < img.data.length; i += 4) if (img.data[i+3]) ink++; rep.imgInk = ink; }
    rep.fbInk = (() => { let n = 0; for (let i = 0; i < W*H; i++) if (fb[i]) n++; return n; })();
  } catch (e){ rep.err = String(e); }
  el.className = '';
  el.textContent = 'PROBE ' + JSON.stringify(rep);
}
if (location.search.indexOf('probe') >= 0) probeScreen();

/* The glyph list, on the page, so a tool can ask the question that matters: is every character of
   every word drawn here something the font can draw? The em dash in the growth line was not, and it
   rendered as a gap that only an outside reader noticed. */
try { document.body.dataset.glyphs = Object.keys(G).join(''); } catch (e) {}

window.MUSEGOTCHI = {
  state: () => S, inputs: () => inputs, log: () => S.log,
  tick: n => { for (let i = 0; i < (n||1); i++){ step(S); } renderAll(); return S; },
  press: (type, arg) => { push(type, arg); return S; },
  act: type => { doInput(S, { t: S.tick, type }); renderAll(); return S; },
  need: () => need(S),
  petPose: () => petPose(S),
  selftest: () => runSelftest(),
  question: () => todayQuestion(S),
  answer: i => { push('answer', i); return S; },
  streak: () => S.streak,
  saveFail: () => saveFail,
  summary: () => ({ name: S.name, day: S.day, stage: STAGE_TAG[S.stage], tick: S.tick,
                    hunger: +S.hunger.toFixed(1), happy: +S.happy.toFixed(1),
                    energy: +S.energy.toFixed(1), clean: +S.clean.toFixed(1),
                    health: +S.health.toFixed(1), care: +S.care.toFixed(1),
                    poops: S.poops.length, sick: S.sick, asleep: S.asleep, lights: S.lights,
                    gone: S.gone, cause: S.cause, need: need(S), shown: S.log.length,
                    skin: activeSkinKey }),
};

let acc = 0, last = performance.now(), live = true;
const SPEEDS = [1, 4, 16];
function loop(now){
  const dt = Math.min(400, now - last); last = now;
  if (live && !S.gone && screen !== 'lost'){
    const per = 250 / SPEEDS[speed];
    acc += dt;
    let guard = 0;
    while (acc >= per && guard++ < 200){ acc -= per; step(S); }
    if (guard) renderAll();
    if (screen !== 'lost' && S.tick % 24 === 0) save();
  } else if (live && S.gone){
    renderAll();                       // let it sit with the news on the screen
  }
  requestAnimationFrame(loop);
}
if (!SHOT && !CARD) requestAnimationFrame(loop);
if (location.search.indexOf('selftest') >= 0) showSelftest();
</script>
