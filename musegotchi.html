<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musegotchi - the Muse you keep in a box</title>
<style>
:root{
  /* every value below is a tone measured out of the operator's sprite sheets */
  --cream:#FCECD2; --cream2:#FCDDBB; --cream3:#EAB188; --brown:#8A4B18;
  --ink:#110452; --ink2:#180863; --gold:#EBBA48; --gold2:#FADB74; --gold3:#A16B17;
  --green:#5E9A38; --green2:#8FC65C; --green3:#143208;
  --red:#DE3F3F; --red2:#FA624C; --red3:#901C3A; --blush:#F7A499;
  --blue:#4260C0; --sky:#94BDFA; --grey:#B0AEBD; --pure:#FFFFFF;
  --px:3px;                      /* one pixel of the page's own grid */
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);-webkit-text-size-adjust:100%;
  font:13px/1.45 ui-monospace,Menlo,monospace}
body{display:flex;justify-content:center;padding:18px 12px 48px;
  /* a 2x2 ordered dither of two creams, the way the screen shades a field */
  background-color:var(--cream);
  background-image:repeating-conic-gradient(var(--cream2) 0 25%, var(--cream) 0 50%);
  background-size:8px 8px}
.wrap{width:100%;max-width:544px}

/* ---- drawn type and icons: the same hand as the screen ---- */
svg.px{display:block;image-rendering:pixelated;overflow:visible}
span[data-px],i[data-px]{display:inline-block}
.pxl{display:block}
.px .ink{fill:var(--ink)}
.px .mid{fill:currentColor}
.px .lite{fill:currentColor;opacity:.55}
.ic{align-self:center;flex:none}

/* ---- the toy: cream stock, brown outline, hard shadow, square corners ---- */
.toy{background:var(--cream);border:var(--px) solid var(--brown);border-radius:0;
  padding:12px 12px 14px;box-shadow:6px 6px 0 var(--cream3)}
.screen{background:var(--ink);border:var(--px) solid var(--ink2);border-radius:0;padding:9px;
  box-shadow:inset 0 0 0 var(--px) var(--ink2)}
canvas{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
.plate{display:flex;justify-content:space-between;align-items:center;color:var(--brown);
  padding:10px 2px 0;gap:8px}
.plate .who{display:flex;align-items:center;gap:6px}
/* the rename made the left label twice as long, and the right-hand one wrapped onto two lines as a
   result - a plate is one line of text, so neither side is allowed to wrap */
.plate .who,.plate>span{white-space:nowrap}
.plate b{color:var(--ink)}
.deck{display:flex;gap:10px;align-items:stretch;margin-top:10px;flex-wrap:wrap}
.slide{flex:1 1 300px;background:var(--cream2);border:var(--px) solid var(--brown);
  border-radius:0;padding:8px 9px 9px;box-shadow:3px 3px 0 var(--cream3);cursor:pointer;
  user-select:none;color:var(--brown)}
.slide .q{margin-bottom:6px;color:var(--brown)}
.slide .note{margin-top:6px;color:var(--brown);opacity:.85}
.slide .track{display:flex;border:var(--px) solid var(--brown);border-radius:0;overflow:hidden;
  background:var(--cream);box-shadow:inset 0 0 0 var(--px) var(--cream3)}
.slide .cell{flex:1;display:flex;justify-content:center;padding:7px 2px;cursor:pointer;
  color:var(--gold3);border-right:var(--px) solid var(--brown)}
.slide .cell:last-child{border-right:0}
.slide .cell.on{background:var(--gold);color:#4A2A08;
  box-shadow:inset var(--px) var(--px) 0 var(--gold2),inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--gold3)}
.slide .cell:not(.on):hover{background:var(--cream2)}

/* ---- the buttons: chunky plates, no glow, pressed by moving a whole pixel ---- */
.btns{display:flex;gap:9px;margin-top:10px}
/* a plate, not a flat rectangle: a hard outline, a light top-left edge and a dark
   bottom-right edge, which is how the sheets shade a fold */
button.p{flex:1;min-width:0;border-radius:0;border:var(--px) solid var(--edge);cursor:pointer;
  color:#4A2A08;background:var(--gold);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:10px 4px 11px;
  --lite:var(--gold2); --shade:var(--gold3); --edge:var(--gold3);
  box-shadow:0 6px 0 var(--edge),inset var(--px) var(--px) 0 var(--lite),
    inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--shade)}
button.p.b{color:var(--pure);background:var(--blue);
  --lite:var(--sky); --shade:#22357A; --edge:#1C3698}
button.p.c{color:var(--pure);background:var(--red);
  --lite:var(--red2); --shade:#8E2020; --edge:var(--red3)}
button.p:active{transform:translateY(6px);box-shadow:inset 0 var(--px) 0 rgba(0,0,0,.25)}
button.p.hot{animation:bob .7s steps(2,end) infinite}
button.p.hot,
button.p.warn{color:var(--pure);background:var(--red);
  --lite:var(--red2); --shade:#8E2020; --edge:var(--red3)}
button.p.b.hot{background:var(--green);color:var(--pure);
  --lite:var(--green2); --shade:var(--green3); --edge:var(--green3)}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ---- panels: sheets of the same cream card ---- */
.card{background:var(--cream);border:var(--px) solid var(--brown);border-radius:0;
  padding:11px 13px 12px;margin-top:12px;box-shadow:6px 6px 0 var(--cream3);
  inset:0}
.card h3{margin:0 0 9px;color:var(--brown)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}
.stat{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px}
.stat .nm{color:var(--brown)}
.hx{display:flex;gap:2px;align-items:center}
/* no width/height on the drawn icons: an 8-pixel grid only stays hard at 8, 16, 24, 32...
   and a CSS 14px was resampling the meter icons into soft little glyphs while the buttons'
   icons (which had no CSS size) stayed crisp. The svg's own width/height is always 8xN. */
.hx svg,.stat .ic svg{width:auto;height:auto}
.stat .v{display:none}
.who2{display:flex;justify-content:space-between;gap:10px;color:var(--brown);margin-top:11px;
  border-top:var(--px) solid var(--cream3);padding-top:10px}
.who2 b{color:var(--ink)}

/* the ask card: the sheets' gold, used as the one loud panel */
.bubble{margin-top:12px;background:var(--gold2);border:var(--px) solid var(--gold3);border-radius:0;
  padding:12px 14px 13px;position:relative;box-shadow:6px 6px 0 var(--gold3)}
.bubble:before{content:"";position:absolute;left:34px;top:-12px;width:0;height:0;
  border:9px solid transparent;border-bottom-color:var(--gold3)}
.bubble h3{margin:0 0 8px;color:var(--gold3)}
.bubble .say{color:var(--ink);margin-bottom:2px}
.bubble .why{margin-top:10px;color:var(--brown)}
.bubble .why div{padding:2px 0}
.hide{display:none}

/* the day card: ruled cream paper, the same stock the sprites are printed on */
.diary{margin-top:12px;background:var(--cream);border:var(--px) solid var(--brown);border-radius:0;
  padding:11px 13px 12px;box-shadow:6px 6px 0 var(--cream3)}
.diary h3{margin:0 0 9px;color:var(--brown)}
.diary .line{padding:8px 0;border-bottom:var(--px) solid var(--cream3)}
.diary .line:last-of-type{border-bottom:0}
.diary .line .t{color:var(--gold3);display:block;margin-bottom:3px}
.diary .n{color:var(--brown);margin-top:10px}
#selftest{white-space:pre-wrap;font:11px/1.5 ui-monospace,Menlo,monospace;margin-top:12px;
  color:var(--sky);background:var(--ink);border:var(--px) solid var(--ink2);border-radius:0;
  padding:12px}
.ok{color:var(--green2)}.bad{color:var(--red2);font-weight:700}
.faces{margin:0 0 6px;flex:1 0 100%}
.faces .q{margin:0 0 7px 2px;color:var(--brown)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
/* each face is painted from its own sheet data, not a label — the picker is part of the art */
.chip{color:var(--brown);background:var(--cream);border:var(--px) solid var(--brown);
  border-radius:0;padding:5px 6px 6px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;box-shadow:3px 3px 0 var(--cream3)}
.chip:hover{background:var(--cream2)}
.chip canvas{width:48px;height:48px;display:block;image-rendering:pixelated;background:var(--cream2)}
.chip.on{background:var(--ink);color:var(--gold2);border-color:var(--gold);
  box-shadow:3px 3px 0 var(--ink2),inset 0 0 0 var(--px) var(--ink2)}
.chip.on canvas{box-shadow:inset 0 0 0 var(--px) var(--gold)}
.head{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.head h3{margin:0}
#facepic{width:48px;height:48px;display:block;image-rendering:pixelated;background:var(--cream2);
  border:var(--px) solid var(--brown);flex:none}
.care{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 9px}
.care button{color:var(--brown);background:var(--cream2);border:var(--px) solid var(--brown);
  border-radius:0;padding:8px 11px;cursor:pointer;box-shadow:3px 3px 0 var(--cream3);
  display:flex;align-items:center;gap:7px}
.care button:hover{background:var(--cream3)}
.care button:active{transform:translateY(3px);box-shadow:none}
/* the three answers: an even row, no default and nothing pre-selected — an outside read saw the
   last button as highlighted, which on a question like this is a lie about the interface */
.bubble .ans{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 2px}
.bubble .ans button{flex:0 0 auto}
button.again{color:var(--cream);background:var(--ink);border:var(--px) solid var(--ink2);
  border-radius:0;padding:10px 14px;margin-top:12px;cursor:pointer;box-shadow:4px 4px 0 var(--ink2)}
button.again:active{transform:translateY(4px);box-shadow:none}
/* ---- the X card: 1600x900, assembled from the same material as the game ---- */
body.cardmode{width:1600px;height:900px;padding:0;display:block;overflow:hidden;
  background-color:var(--cream);
  background-image:repeating-conic-gradient(var(--cream2) 0 25%, var(--cream) 0 50%);
  background-size:8px 8px}
body.cardmode .wrap{display:none}
/* a feed-scale proof: the same card at the size X actually shows it in a timeline */
body.cardmode.feed{transform:scale(.3125);transform-origin:0 0}
#card{display:none}
body.cardmode #card{display:block;position:relative;width:1600px;height:900px}
body.cardmode #card .screen.bezel{position:absolute;left:40px;top:3px;width:990px;padding:9px;
  border:var(--px) solid var(--ink2);background:var(--ink);
  box-shadow:9px 9px 0 var(--cream3)}
body.cardmode #card .cardcol{position:absolute;left:1060px;top:0;width:520px;height:900px;
  display:flex;flex-direction:column;justify-content:center;gap:22px;color:var(--ink)}
body.cardmode #card .eyebrow{color:var(--brown)}
body.cardmode #card .kicker{margin:0;color:var(--ink)}
body.cardmode #card .kicker .pxl{display:block}
body.cardmode #card .sub{color:var(--brown)}
body.cardmode #card .facts{display:flex;flex-direction:column;gap:14px}
body.cardmode #card .fact{display:flex;align-items:flex-start;gap:12px;color:var(--ink)}
body.cardmode #card .fact.a svg .mid{fill:var(--gold3)}
body.cardmode #card .fact.b svg .mid{fill:var(--red3)}
body.cardmode #card .fact.c svg .mid{fill:var(--green3)}
body.cardmode #card .fact svg{margin-top:2px}
body.cardmode #card .foot{color:var(--brown);border-top:var(--px) solid var(--cream3);padding-top:14px}
body.cardmode #card .cta{background:var(--gold);color:#4A2A08;border:var(--px) solid var(--gold3);
  padding:12px 14px;box-shadow:5px 5px 0 var(--gold3);align-self:flex-start;
  box-shadow:5px 5px 0 var(--gold3),inset var(--px) var(--px) 0 var(--gold2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="toy">
    <div class="screen"><canvas id="lcd" width="480" height="432"></canvas></div>
    <div class="plate">
      <span class="who" id="plateLeft"></span>
      <span id="plateRight"></span>
    </div>
    <div class="deck">
      <div class="slide" id="slide" title="The light in the box">
        <div class="q" id="slideQ"></div>
        <div class="track" id="track">
          <div class="cell" id="c0"></div>
          <div class="cell" id="c1"></div>
        </div>
        <div class="note" id="slideNote"></div>
      </div>
      <div class="btns">
        <button class="p" id="b1"></button>
        <button class="p b" id="b2"></button>
        <button class="p c" id="b3"></button>
      </div>
      <div class="faces">
        <div class="q" id="facesQ"></div>
        <div class="pills" id="faces"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="head"><canvas id="facepic" width="0" height="0"></canvas><h3 id="whohead"></h3></div>
    <div class="stats" id="hud"></div>
    <div class="who2" id="ctxline"></div>
  </div>

  <div class="bubble hide" id="askcard"></div>

  <div class="diary" id="panel"></div>

  <div id="selftest" class="hide"></div>
</div>
</div>

<script>
"use strict";
/* ============================================================================
   Musegotchi - a tamagotchi built on Meta's Muse (launched 2026-09-08).

   The look:  the operator's reference for the Muse mascot - a plush hooded blob,
              no arms or legs, pale fleece, a smooth cream face, two solid dot eyes
              with a catchlight, a small smile, soft blush. Reproduced in its own
              colours rather than a guess at them: I had this wrong once already.

   The rules: unchanged from the verified build. Deterministic tick simulation
              over a hash-chained event ledger; a run is (seed + input log).
   The look:  160x144, a Game Boy Color screen, sixteen colours, hard edges,
              ordered dithering, integer upscale, no anti-aliasing.
   ========================================================================== */

/* ---------------------------------------------------------------- 0. sha256 */
const SHA256 = (() => {
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H0 = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
                              0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const rotr = (x,n) => (x >>> n) | (x << (32 - n));
  return function sha256(str){
    const b = new TextEncoder().encode(str), l = b.length;
    const buf = new Uint8Array((((l + 9) >> 6) + 1) << 6);
    buf.set(b); buf[l] = 0x80;
    const dv = new DataView(buf.buffer), bitLen = l * 8;
    dv.setUint32(buf.length - 8, Math.floor(bitLen / 4294967296), false);
    dv.setUint32(buf.length - 4, bitLen >>> 0, false);
    const H = H0.slice(), w = new Uint32Array(64);
    for (let i = 0; i < buf.length; i += 64) {
      for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4, false);
      for (let t = 16; t < 64; t++) {
        const a15 = w[t-15], a2 = w[t-2];
        const s0 = rotr(a15,7) ^ rotr(a15,18) ^ (a15 >>> 3);
        const s1 = rotr(a2,17) ^ rotr(a2,19) ^ (a2 >>> 10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
      }
      let a = H[0], bb = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let t = 0; t < 64; t++) {
        const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
        const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        const maj = (a & bb) ^ (a & c) ^ (bb & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0]+a)>>>0;  H[1] = (H[1]+bb)>>>0; H[2] = (H[2]+c)>>>0;  H[3] = (H[3]+d)>>>0;
      H[4] = (H[4]+e)>>>0;  H[5] = (H[5]+f)>>>0;  H[6] = (H[6]+g)>>>0;  H[7] = (H[7]+h)>>>0;
    }
    let out = ''; for (let i = 0; i < 8; i++) out += H[i].toString(16).padStart(8, '0');
    return out;
  };
})();

/* --------------------------------------------------------------- 1. rng/util */
function mulberry32(a){
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const r1 = n => Math.round(n * 10) / 10;
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length) % arr.length];

/* ------------------------------------------------------ 2. the pet's rules */
/* Musegotchi is a pet. It is named after a muse and drawn from the operator's sheets, but what it
   *is* comes from the tamagotchi vocabulary: a creature that gets hungry, bored, dirty, tired
   and ill, and four or five things you can do about it. There is no permission gate, no token
   budget and no task queue - none of that was the mascot, it was an agent's paperwork wearing
   the mascot's face. */
const T = { HOUR: 60, DAY: 1440 };          // one tick is one in-world minute

const CFG = {
  HUNGER:    1 / 9,      // hunger points lost per tick: a meal carries it a few hours
  HAPPY:     1 / 13,
  ENERGY:    1 / 11,     // while awake
  SLEEP:     1 / 4.5,    // energy per tick asleep: a full tank in about seven in-world hours
                         // (at 1/7 a pet that tired itself out took twenty-five hours to wake,
                         // so it was still asleep, exhausted, at midday)
  MEAL:      34,
  SNACK_F:   9,
  SNACK_H:   13,
  SNACKS:    4,          // more than this in a day and it makes itself ill
  FULL:      95,
  PLAY_COST: 7,
  PLAY_WIN:  24,
  PLAY_TIME: 300,        // ticks the bar sweeps before the chance is gone
  PET_GAIN:  4,
  PET_COOL:  45,
  POOP_EVERY: 150,       // a meal comes back round
  POOP_MAX:  6,
  POOP_CLEAN: 15,
  SICK_AT:   46,
  WELL_AT:   64,
  CURE:      38,
  STAGE_DAYS: [2, 4, 8], // days at which it MAY grow...
  STAGE_CARE: 52,        // ...if it has been looked after at least this well
  OFFLINE_CAP: 480,      // you cannot come back to a corpse: away time counts, but capped
  LOG_KEEP:  30,
  /* --- the five things the town asked for (musebook 59553). The mechanisms are theirs; the
     numbers are the pet's, and each one is named with the post it came from. --- */
  COMPANY_FILL: 1 / 8,   // company per tick while the page is open (Mikey)
  COMPANY_CAP:  40,      // ...but only this much in one day: the drain resets the count
  COMPANY_DRAIN: 1 / 6,  // away from you it misses you faster than it gets hungry
  COMPANY_LOW:  30,      // under this it stops asking and just looks at you
  Q_WARN_AT:    960,     // the day's last third: the point at which the answer still counts
  Q_FILL:       6,       // spirits for telling it something you have not said before (perry)
  GREET_AFTER:  60,      // an hour away and it has a hello waiting (Pack Rip)
  GREET_WINDOW: 40,      // it waits this long before the hello is spent by not being spent
  VOICE_DECAY:  1 / 30,  // the quiet row: never on a meter, told only by an absence (Z)
  VOICE_LOW:    25,      // under this the chatter stops
  VOICE_MUTE:   10,      // under this it stops playing on its own as well
};

const NAMES = ['PIP','MOCHI','BONBON','TATO','MIMI','BUBU','NUGGET','PUDDING','MOMO',
               'BISCUIT','DOODLE','SUSU','PUFF','CUSTARD','MARSH','TOFU'];
const STAGE_NAME = ['a tiny hatchling', 'a curious child', 'a lanky teen', 'a grown muse'];
const STAGE_TAG  = ['MusegotchiLING', 'CHILD', 'TEEN', 'GROWN'];

/* ---- the daily question (perry, musebook 59613) --------------------------------------------
   One small question a day. It only counts when the answer DIFFERS from the day before: the pet
   can test that, and cannot read back what yesterday was, because nothing but a digest is kept -
   one rolling value, replaced each day. The question is chosen from the seed and the day, so a
   replay asks the same one. */
const QUESTIONS = [
  { q: 'Which one shall I keep?', o: ['the ball', 'the bowl', 'the star'] },
  { q: 'What is today like?',     o: ['busy', 'quiet', 'strange'] },
  { q: 'Where shall I sit?',      o: ['in the sun', 'in the shade', 'by the wall'] },
  { q: 'What shall we do?',       o: ['run about', 'sit still', 'look around'] },
  { q: 'Which do you like?',      o: ['mornings', 'afternoons', 'nights'] },
  { q: 'What is outside?',        o: ['rain', 'wind', 'nothing much'] },
];
function todayQuestion(s){
  const r = mulberry32((s.seed ^ Math.imul(s.day, 2654435761)) >>> 0);
  const id = Math.floor(r() * QUESTIONS.length) % QUESTIONS.length;
  return { day: s.day, id: id, q: QUESTIONS[id].q, o: QUESTIONS[id].o };
}
/* Keyed on the QUESTION and the choice — not on the day. Keying it on the day made every
   answer "different" by construction, so the streak advanced whatever the caretaker said and the
   mechanism meant nothing. The first version of the self-test caught exactly that. */
function answerDigest(s, id, i){ return SHA256(s.seed + ':' + id + ':' + i); }

/* the pet own words, in its own voice — the player reads these, so they are what makes it
   feel alive rather than a set of meters */
const SAY = {
  hungry:  ['I am hungry. Could I have something?', 'My tummy is rumbling.', 'Something to eat, please?'],
  starve:  ['I am so hungry I could cry.', 'Please, I have not eaten in ages.'],
  bored:   ['I am bored. Will you play with me?', 'Nothing to do. Play with me?'],
  lonely:  ['I am a bit lonely.', 'Do you have a minute? I missed you.'],
  dirty:   ['It is messy in here.', 'Something smells. Can you tidy up?', 'There is a mess on the floor.'],
  sleepy:  ['I am sleepy. Turn the light off?', 'My eyes keep closing.'],
  sick:    ['I do not feel well.', 'I feel poorly. Do you have medicine?'],
  full:    ['I could not eat another bite.', 'I am full, thank you.'],
  sweets:  ['Too many sweets! My tummy hurts.', 'No more snacks, I am queasy.'],
  notsick: ['Medicine? I am not ill. I do not want it.', 'I am fine, really - no medicine.'],
  sleep:   ['Goodnight.', 'I am going to sleep now.', 'Off to sleep. Wake me if you need me.'],
  wake:    ['Morning!', 'I am awake. Hello!', 'That was a good nap.'],
  grumpy:  ['You woke me up! I was having a lovely dream.', 'Wah. I was asleep.'],
  playok:  ['That was fun!', 'Again! Again!', 'Wheee!'],
  playbad: ['You missed me. That is all right.', 'Nearly! Try again?'],
  pet:     ['That is nice.', 'Mmm. Hello.', 'I like it when you do that.'],
  clean:   ['All clean! Thank you.', 'Much better in here.'],
  nothing: ['Nothing to tidy - I have been good.', 'It is already clean in here.'],
  grow:    ['Look at me! I grew.', 'I am bigger than yesterday!'],
  rest:    ['I am just resting.', 'Having a little sit down.'],
};

/* -------------------------------------------------------- 3. the creature */
function newState(seed, agentNo){
  const rng = mulberry32(seed >>> 0);
  const s = {
    seed: seed >>> 0, agentNo: agentNo || 1, rng: rng,
    name: NAMES[(seed >>> 3) % NAMES.length],
    tick: 0, day: 1, born: Date.now(),
    hunger: 74, happy: 72, energy: 84, clean: 100, health: 100,
    care: 100, careMarks: 0, marksAt: 0,
    stage: 0, grownAt: 0,
    meal: 0, snacksToday: 0, lastPoop: 0, poops: [],
    asleep: false, lights: true, sick: false, call: false, callWhy: null,
    /* null, not 0: a feed at tick 0 was invisible to every `if (s.lastFeed)` test — the same
       falsy-zero trap that made a sprite read as absent earlier in this project */
    lastPet: -999, lastFeed: null, lastPlay: null, lastHeart: null, lastLog: null, lastLogAt: 0,
    play: null, gone: false, cause: null,
    log: [], scene: 'idle',
    inputs: [], inputPtr: 0,
    /* --- what the town added. Not one of these appears on a meter. --- */
    company: 88, companyDay: 1, companyFilled: 0, away: false,
    voice: 100, voiceWarned: false, voiceLost: false,
    greet: null, greetMissed: false,
    /* the daily question. The answer itself is never stored — only a digest of it, and that
       digest is folded into the checksum, so a hand-edited one is refused like any other
       corrupt record instead of quietly granting a fresh day. */
    q: { day: 0, id: -1, digest: null, answered: false, warned: false },
    streak: 0,
  };
  log(s, 'I am here! Hello.', 'note');
  return s;
}
function careNow(s){ return clamp(100 - s.careMarks * 12, 0, 100); }
function log(s, text, kind){
  s.log.push({ t: s.tick, d: s.day, text: text, kind: kind || 'note' });
  if (s.log.length > CFG.LOG_KEEP) s.log.shift();
  s.lastLog = kind; s.lastLogAt = s.tick;
}
function petLine(s, key){
  const lines = SAY[key]; if (!lines) return '';
  /* NOT s.rng. Rendering must not consume the simulation's random stream, or a redraw in a
     different order would land on a different pet. Seeded from the seed, the key and the
     minute, so it is stable across redraws and still varies. */
  const r = mulberry32((s.seed ^ Math.imul(key.length + 7, 2654435761) ^ Math.floor(s.tick / 60)) >>> 0);
  return lines[Math.floor(r() * lines.length) % lines.length];
}
function isNight(t){
  const h = Math.floor((t % T.DAY) / T.HOUR);
  return h < 6 || h >= 21;
}
/* what it wants right now, most urgent first — one need, so the player always knows */
function need(s){
  if (s.gone) return 'gone';
  if (s.asleep) return null;      // you do not nag something that is asleep
  if (s.sick) return 'sick';
  if (s.hunger < 14) return 'starve';
  if (s.clean < 30) return 'dirty';
  if (s.hunger < 34) return 'hungry';
  if (s.energy < 22) return 'sleepy';
  if (s.happy < 30) return 'bored';
  if (s.happy < 45) return 'lonely';
  return null;
}
function poopAt(s){
  return { x: 20 + Math.floor(s.rng() * (W - 46)), y: 108 + Math.floor(s.rng() * 24), at: s.tick };
}

/* ------------------------------------------------------------ 4. your verbs */
/* Everything the player can do. Called through doInput() so the whole game is still
   seed + input log, and a replay lands on the same creature. */
function doInput(s, inp){
  const t = inp.type;
  if (t === 'feed')     return actFeed(s, false);
  if (t === 'snack')    return actFeed(s, true);
  if (t === 'play')     return actPlay(s);
  if (t === 'hit')      return playHit(s);
  if (t === 'clean')    return actClean(s);
  if (t === 'medicine') return actMedicine(s);
  if (t === 'lights')   return actLights(s);
  if (t === 'pet')      return actPet(s);
  if (t === 'restart')  return actRestart(s);
  if (t === 'answer')   return actAnswer(s, inp.arg);
  if (t === 'away')     return;
  return;
}
function actFeed(s, snack){
  if (s.gone) return;
  contact(s, snack ? 'snack' : 'feed');
  if (s.asleep){ log(s, '...zzz... (asleep)', 'sleep'); return; }
  if (snack && s.snacksToday >= CFG.SNACKS){
    log(s, petLine(s, 'sweets'), 'note'); s.happy = clamp(s.happy - 3, 0, 100); s.care = clamp(s.care - 1, 0, 100); return;
  }
  if (s.hunger >= CFG.FULL){ log(s, petLine(s, 'full'), 'note'); return; }
  if (snack){
    s.hunger = clamp(s.hunger + CFG.SNACK_F, 0, 100);
    s.happy = clamp(s.happy + CFG.SNACK_H, 0, 100);
    s.snacksToday++;
    if (s.snacksToday > CFG.SNACKS - 1) s.health = clamp(s.health - 9, 0, 100);   // too many sweets
    log(s, 'Snack! ' + (s.snacksToday >= CFG.SNACKS - 1 ? 'I feel a bit queasy.' : 'Yum.'), 'feed');
  } else {
    s.hunger = clamp(s.hunger + CFG.MEAL, 0, 100);
    s.happy = clamp(s.happy + 4, 0, 100);
    s.meal++; s.lastFeed = s.tick;
    log(s, 'A proper meal. Thank you.', 'feed');
  }
  s.care = clamp(s.care + 2.5, 0, 100);
  s.health = clamp(s.health + 1.5, 0, 100);
}
function actPlay(s){
  if (s.gone) return;
  contact(s, 'play');
  if (s.asleep){ log(s, '...zzz... (asleep)', 'sleep'); return; }
  if (s.sick){ log(s, 'I do not want to play. I feel poorly.', 'note'); s.happy = clamp(s.happy - 2, 0, 100); return; }
  if (s.energy < 20){ log(s, 'I am too tired to play.', 'note'); return; }
  if (s.play) return;
  s.play = { t: 0, pos: 0, dir: 1, done: null };
  s.scene = 'play';
}
function playHit(s){
  if (s.gone) return;
  contact(s, 'hit');
  if (!s.play || s.play.done) return;
  const p = s.play;
  const d = Math.abs(p.pos - 0.5) * 2;                 // 0 at the middle, 1 at the edge
  const good = d < 0.18;
  const ok = d < 0.42;
  p.done = good ? 'good' : (ok ? 'ok' : 'bad');
  s.happy = clamp(s.happy + (good ? CFG.PLAY_WIN : ok ? CFG.PLAY_WIN * 0.5 : 3), 0, 100);
  s.energy = clamp(s.energy - CFG.PLAY_COST, 0, 100);
  s.care = clamp(s.care + (good ? 3 : ok ? 1 : -1.5), 0, 100);
  s.lastPlay = s.tick;
  log(s, (good ? 'That was fun! ' : ok ? 'Nearly! ' : 'You missed me, but that is all right.') +
          (good ? 'Again!' : 'Try again?'), 'play');
  s.play = null; s.scene = 'idle';
}
function actClean(s){
  if (s.gone) return;
  contact(s, 'clean');
  if (s.gone) return;
  if (!s.poops.length){ log(s, petLine(s, 'nothing'), 'note'); s.care = clamp(s.care + 0.5, 0, 100); return; }
  const n = s.poops.length;
  s.poops = [];
  s.clean = 100;
  s.happy = clamp(s.happy + 3 + n, 0, 100);
  s.care = clamp(s.care + 4, 0, 100);
  log(s, petLine(s, 'clean') + (n > 1 ? ' (' + n + ' messes)' : ''), 'clean');
}
function actMedicine(s){
  if (s.gone) return;
  contact(s, 'medicine');
  if (s.gone) return;
  if (!s.sick){ log(s, petLine(s, 'notsick'), 'note'); s.happy = clamp(s.happy - 4, 0, 100); s.care = clamp(s.care - 1.5, 0, 100); return; }
  s.health = clamp(s.health + CFG.CURE, 0, 100);
  s.care = clamp(s.care + 4, 0, 100);
  if (s.health > CFG.WELL_AT) s.sick = false;
  log(s, s.sick ? 'The medicine is helping. I still feel rough.' : 'That worked. I feel much better!', 'sick');
}
function actLights(s){
  if (s.gone) return;
  contact(s, 'lights');
  if (s.gone) return;
  s.lights = !s.lights;
  if (!s.lights){
    log(s, 'Lights out. ' + petLine(s, 'sleep'), 'sleep');
    if (s.energy < 92){ s.asleep = true; s.sleepAt = s.tick; }
  } else {
    if (s.asleep){
      s.asleep = false;
      log(s, petLine(s, 'grumpy'), 'wake');
      s.happy = clamp(s.happy - 5, 0, 100);           // waking a sleeping pet is mean, like the real thing
      s.care = clamp(s.care - 2, 0, 100);
    } else {
      log(s, 'Lights on.', 'note');
    }
  }
}
function actPet(s){
  if (s.gone) return;
  contact(s, 'pet');
  if (s.gone) return;
  if (s.asleep){ log(s, '...zzz...', 'sleep'); return; }
  if (s.tick - s.lastPet < CFG.PET_COOL) return;
  s.lastPet = s.tick;
  s.happy = clamp(s.happy + CFG.PET_GAIN, 0, 100);
  s.care = clamp(s.care + 1, 0, 100);
  s.lastHeart = s.tick;
  if (s.rng() < 0.35) log(s, petLine(s, 'pet'), 'note');
}
/* Pack Rip's reunion (musebook 59647): a hello that was waiting is spent by the FIRST touch,
   whatever the touch is. It is not a meter and it is never a care mistake - the absence has
   already been paid for in hunger and spirits, and a pet that bills you twice for one trip
   away is a pet that punishes you for having a life. If nobody comes, the hello expires and the
   record says so once. */
/* Every verb goes through here, because "contact" means the caretaker touched it — whether that
   was a click on the page or a keeper driving the game in a test. Putting this in doInput() looked
   tidier and was wrong: the internal keepers call the verbs directly, so the quiet row only ever
   fell and every demo drifted into a mute pet. */
const VOICE_FOR = { pet: 12, play: 7, hit: 5, answer: 10, feed: 2, snack: 2, clean: 2, medicine: 2, lights: 1 };
function contact(s, kind){
  const up = VOICE_FOR[kind];
  if (up){
    s.voice = clamp(s.voice + up, 0, 100);
    if (s.voice > 60){ s.voiceWarned = false; s.voiceLost = false; }
    if (s.greet) spendGreeting(s);
  }
  return s;
}
function spendGreeting(s){
  s.greet = null;
  s.happy = clamp(s.happy + 10, 0, 100);
  log(s, 'You came back. I was waiting to say hello.', 'note');
}
/* perry's question. The answer is turned into a digest and immediately forgotten: what is kept
   is whether today differed from yesterday, which is all the pet is allowed to know. A missed
   question costs no care mistake - the reward for answering is spirits, not a fine for silence. */
function actAnswer(s, i){
  if (s.gone) return;
  const t = todayQuestion(s);
  if (s.q.answered && s.q.day === t.day) return;              // once a day, and only once
  if (typeof i !== 'number' || i < 0 || i >= t.o.length) return;
  contact(s, 'answer');
  const d = answerDigest(s, t.id, i);
  const first = s.q.digest === null;
  const differed = !first && d !== s.q.digest;
  s.q = { day: t.day, id: t.id, digest: d, answered: true, warned: false };
  if (first){
    log(s, 'You told me. I will remember that you did.', 'q');
  } else if (differed){
    s.streak++;
    s.happy = clamp(s.happy + CFG.Q_FILL, 0, 100);
    log(s, 'That is not what you said before. I like it.', 'q');
  } else {
    log(s, 'The same as before. That is all right.', 'q');
  }
}
function actRestart(s){
  const seed = (Date.now() ^ 0x5f3759df) >>> 0;
  const fresh = newState(seed, s.agentNo);
  for (const k in fresh) s[k] = fresh[k];
}

/* ---------------------------------------------------------- 5. the tick loop */
function step(s){
  s.tick++;
  s.day = 1 + Math.floor(s.tick / T.DAY);
  if (s.tick % T.DAY === 0) s.snacksToday = 0;
  /* a CLERK reads the day out in its own voice - the one form behaviour that is not a gate, because it
     costs nothing and is the only way a routine is ever seen from the inside */
  if (formEffect(s, 'turn')) log(s, 'Day ' + s.day + '. Still here.', 'note');
  if (s.gone) return;
  const before = s.sick;
  if (s.asleep){
    s.energy = clamp(s.energy + CFG.SLEEP, 0, 100);
    s.hunger = clamp(s.hunger - CFG.HUNGER * 0.35, 0, 100);   // it still gets hungry asleep
    if (s.energy >= 92){
      s.asleep = false;
      log(s, petLine(s, 'wake'), 'wake');
      s.care = clamp(s.care + 1, 0, 100);
    }
  } else {
    s.hunger = clamp(s.hunger - CFG.HUNGER, 0, 100);
    const drag = 1 + (s.clean < 40 ? 0.5 : 0) + (s.sick ? 0.6 : 0) + (s.hunger < 20 ? 0.4 : 0) +
                   (s.company < CFG.COMPANY_LOW ? 0.25 : 0);
    s.happy = clamp(s.happy - CFG.HAPPY * drag, 0, 100);
    s.energy = clamp(s.energy - CFG.ENERGY, 0, 100);
    if (s.energy <= 3){
      s.asleep = true; s.sleepAt = s.tick;
      log(s, 'I fell asleep where I was standing.', 'sleep');
    }
  }
  /* digestion: a meal comes back round, and the floor is the player's problem */
  if (s.meal > 0 && s.tick - s.lastPoop > CFG.POOP_EVERY && s.poops.length < CFG.POOP_MAX){
    s.poops.push(poopAt(s)); s.lastPoop = s.tick; s.meal--;
    if (s.poops.length === CFG.POOP_MAX) log(s, 'I am sorry about the floor.', 'note');
  }
  s.clean = clamp(100 - s.poops.length * CFG.POOP_CLEAN, 0, 100);
  /* health: neglect shows up here, slowly enough to be fair and fast enough to matter */
  const bad = (s.hunger < 12 ? 1 : 0) + (s.clean < 25 ? 1 : 0) + (s.poops.length >= 4 ? 1 : 0) +
              (s.happy < 12 ? 1 : 0) + (s.sick ? 1 : 0);
  if (bad) s.health = clamp(s.health - 0.010 * bad, 0, 100);
  else     s.health = clamp(s.health + 0.006, 0, 100);
  /* illness */
  if (!s.sick && s.health < CFG.SICK_AT){
    s.sick = true;
    log(s, 'I feel poorly. I think I need medicine.', 'sick');
  } else if (s.sick && s.health > CFG.WELL_AT){
    s.sick = false;
    log(s, 'I feel like myself again!', 'sick');
  }
  /* how well it has been looked after: counted the way the originals counted it — a MISTAKE
     is an hour in which something was critical, not a running average of the meters. An
     average let a clean floor and a good night's sleep hide starvation: a pet at hunger 0
     spent most of the day asleep, averaged 52/100 and was judged "looked after" and allowed
     to grow. Twelve points per mistake, so five mistakes and it does not grow. */
  if (s.tick % T.HOUR === 0){
    const critical = s.hunger < 20 || s.happy < 20 || s.clean < 25 || s.health < 40;
    if (critical) s.careMarks++;
  }
  s.care = careNow(s);
  /* the call: it asks for you, once, and the plate blinks */
  const n = need(s);
  s.call = !!n && n !== 'gone';
  s.callWhy = n;
  if (n === 'starve' && s.callWhy !== s.lastCall){ log(s, petLine(s, 'starve'), 'note'); }
  s.lastCall = s.callWhy;
  /* the play window closes if you do not take it */
  if (s.play){
    const p = s.play;
    p.pos += p.dir * 0.019;
    if (p.pos >= 1){ p.pos = 1; p.dir = -1; }
    if (p.pos <= 0){ p.pos = 0; p.dir = 1; }
    p.t++;
    if (p.t > CFG.PLAY_TIME){ s.play = null; log(s, 'You were busy. Maybe later!', 'note'); }
  }
  /* --- company (Mikey, musebook 59609). It fills only while the page is open, is capped per
     day so a parked tab gains nothing, and drains faster while you are away. It is never a meter
     and it never asks: at low company the pet stops asking for anything and just looks at you. --- */
  if (s.companyDay !== s.day){ s.companyDay = s.day; s.companyFilled = 0; }
  if (s.away){
    s.company = clamp(s.company - CFG.COMPANY_DRAIN, 0, 100);
  } else if (s.companyFilled < CFG.COMPANY_CAP){
    const gain = Math.min(CFG.COMPANY_FILL, CFG.COMPANY_CAP - s.companyFilled);
    s.company = clamp(s.company + gain, 0, 100);
    s.companyFilled += gain;
  }
  /* --- Z's quiet row (musebook 59610). Off every meter, and told only by an ABSENCE: while it
     is awake and open to you it talks to itself every few hours, and below the low mark that
     stops. The one line it says on the way down is the warning; after that the silence is the
     tell, and when it has gone entirely the record notes it once and the neglect starts to show
     on the meters instead. --- */
  if (!s.asleep && !s.gone) s.voice = clamp(s.voice - CFG.VOICE_DECAY, 0, 100);
  if (!s.asleep && !s.voiceWarned && s.voice < CFG.VOICE_LOW){
    s.voiceWarned = true;
    log(s, 'I have not had much to say lately.', 'note');
  }
  if (!s.asleep && s.voice <= 0 && !s.voiceLost){
    s.voiceLost = true;
    log(s, 'I stopped talking a while ago. I do not mind.', 'note');
  }
  if (s.voiceLost && !s.gone) s.health = clamp(s.health - 0.004, 0, 100);
  if (!s.asleep && s.voice >= CFG.VOICE_LOW && s.happy > 45 && s.tick % (T.HOUR * 6) === 0)
    log(s, petLine(s, 'rest'), 'note');
  /* --- the hello that was waiting (Pack Rip) --- */
  if (s.greet){
    s.greet.wait--;
    if (s.greet.wait <= 0 && !s.gone){
      s.greet = null;
      log(s, 'I waited to say hello and it never came. I wrote it down.', 'note');
    }
  }
  /* --- the daily question (perry) --------------------------------------------------------
     A skip is not a mistake and does not break the streak: it simply does not advance it. The
     warning fires ONCE, in the day's last third, while the answer can still be given. When the
     day has already gone, the record says so and asks for nothing - a warning about a day that
     is over would be a reproach dressed as help (settled with Mikey, musebook 59678). */
  const tq = todayQuestion(s);
  if (s.q.day !== tq.day){
    if (s.q.day && !s.q.answered)
      log(s, 'Yesterday I asked and nobody answered. I wrote it down.', 'q');
    s.q = { day: tq.day, id: tq.id, digest: s.q.digest, answered: false, warned: false };
  }
  if (!s.q.answered && !s.q.warned && (s.tick % T.DAY) >= CFG.Q_WARN_AT){
    s.q.warned = true;
    log(s, 'Today you have not told me anything yet.', 'q');
  }
  checkGrowth(s);
  if (s.health <= 0) farewell(s);
}
function checkGrowth(s){
  if (s.stage >= 3 || s.gone) return;
  const due = CFG.STAGE_DAYS[s.stage];
  if (s.day >= due && careNow(s) >= CFG.STAGE_CARE){
    s.stage++; s.grownAt = s.tick;
    s.happy = clamp(s.happy + 12, 0, 100);
    log(s, 'Look at me - I am ' + STAGE_NAME[s.stage] + ' now!', 'grow');
  } else if (s.tick % T.DAY === 0 && s.day === due + 1 && careNow(s) < CFG.STAGE_CARE){
    /* Mikey's ruling (60023, accepted 60031): the closing line speaks at the day turn that ENDS the due
       day, and its words name the window closing, not the door. The door is still open — growth stays
       live on every later day — so a line that said the gate shut would narrate a shut that never
       happens. The tick test is true at exactly one tick per stage, so this needs no flag: stageWarn
       retired with the miss line rather than being repurposed. */
    /* Mikey's ruling (59914 -> 59927) has TWO halves: not card-only - the count is read out loud AT the
       closing, in the pet's voice, with the count in it, and the death card keeps the arithmetic after.
       So the line names the window (not the door, which never shut) and carries the count it is about,
       in the card's own grammar. */
    log(s, 'The day I was due has gone by. I am still here, and ' + s.careMarks + ' hour' +
        (s.careMarks === 1 ? '' : 's') + ' of it went unlooked-after.', 'close');
  }
}
function farewell(s){
  s.gone = true; s.asleep = false; s.call = false;
  s.cause = s.hunger < 20 ? 'hungry' : 'unwell';
  log(s, s.cause === 'hungry'
      ? 'I am so sorry. I was too hungry for too long, and I had to go.'
      : 'I am sorry. I was not well, and nobody came with medicine. Goodbye.', 'bye');
}
/* which pose it wears — the pet's mood is on its face, which is the whole point of importing
   twelve poses instead of one */
function petPose(s){
  const t = s.tick;
  if (s.gone) return 'back';
  if (s.asleep) return 'flat';
  if (s.play) return 'joy';
  if (s.sick) return 'sad';
  if (s.lastHeart !== null && t - s.lastHeart < 70) return 'content';
  if (s.lastFeed !== null && t - s.lastFeed < 90) return 'cheer';
  if (s.lastPlay !== null && t - s.lastPlay < 120) return 'joy';
  if (s.call && (s.callWhy === 'hungry' || s.callWhy === 'starve' || s.callWhy === 'dirty')) return 'surprise';
  if (s.energy < 26) return 'content';
  /* low company is the one need that never asks: it stops what it was doing and looks at you */
  if (s.company < CFG.COMPANY_LOW) return 'wave';
  let bag = [];
  if (s.happy > 70) bag.push('content', 'cheer', 'joy');
  if (s.happy < 35) bag.push('sad', 'shy');
  if (s.clean < 40) bag.push('shy');
  if (isNight(t) && s.lights) bag.push('content');
  bag.push('idle', 'idle2', 'side');
  /* a quiet pet stops playing on its own as well — the second half of the absence */
  if (s.voice < CFG.VOICE_MUTE) bag = ['idle', 'idle2', 'side'];
  const beat = Math.floor(t / 16);
  const mix = (Math.imul(beat + 1, 2654435761) ^ 0x9e3779b9) >>> 0;
  return bag[(mix >>> 16) % bag.length];
}

const W = 160, H = 144;
let VIEW = 3;                                   // CSS pixels per game pixel - always an integer
const fb = new Uint8Array(W * H);
const mask = new Uint8Array(W * H);
let maskOn = false;
const cv = document.getElementById('lcd');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
let img = null;
try { img = octx.createImageData(W, H); } catch (e) { img = null; }

/* Integer upscale only. Stretching a 160px buffer to an arbitrary CSS width resamples it
   to fractional pixels and the lattice stops being a lattice - a grid check on the first
   screenshots found 23.6% of 6x6 blocks were not flat because CSS was scaling 480 to 468.
   So: measure the slot, take the largest whole multiple that fits, and letterbox the rest. */
function fitCanvas(){
  const holder = cv.parentElement;
  const avail = Math.max(W, holder ? holder.clientWidth : W);
  VIEW = Math.max(1, Math.floor(avail / W));
  cv.width = W * VIEW; cv.height = H * VIEW;
  cv.style.width = (W * VIEW) + 'px';
  cv.style.height = (H * VIEW) + 'px';
  /* the QA control has to be applied here, after any resize, or the handler undoes it */
  if (typeof STRETCH !== 'undefined' && STRETCH) cv.style.width = Math.round(W * VIEW * 0.975) + 'px';
  ctx.imageSmoothingEnabled = false;
}

function px(x, y, c){
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  fb[y*W + x] = c === undefined ? INK : c;
  if (maskOn) mask[y*W + x] = 1;
}
function rect(x, y, w, h, c){ for (let j=0;j<h;j++) for (let i=0;i<w;i++) px(x+i, y+j, c); }
function hline(x0, x1, y, c){ for (let x = x0; x <= x1; x++) px(x, y, c); }
function disc(cx, cy, r, c){
  for (let y = -r; y <= r; y++){
    const w = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)));
    hline(cx - w, cx + w, cy + y, c);
  }
}
function blob(cx, cy, rx, ry, c){
  for (let y = -ry; y <= ry; y++){
    const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y*y)/(ry*ry))));
    hline(cx - w, cx + w, cy + y, c);
  }
}
/* A superellipse, sub-sampled 2x2. This is how you get a smooth chunky pixel curve
   instead of the stair-stepped one a plain ellipse rasterises into. */
function egg(cx, cy, rx, ry, c, n){
  n = n || 2.4;
  for (let y = -ry - 1; y <= ry + 1; y++){
    for (let x = -rx - 1; x <= rx + 1; x++){
      let hits = 0;
      for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++){
        const u = (x - 0.25 + sx*0.5) / rx, v = (y - 0.25 + sy*0.5) / ry;
        if (Math.pow(Math.abs(u), n) + Math.pow(Math.abs(v), n) <= 1) hits++;
      }
      if (hits >= 3) px(cx + x, cy + y, c);
    }
  }
}
/* the 1px shell between two nested superellipses — hood rims, and the two-tone shading
   that makes a pixel sprite read as round. `only` limits it to one side. */
function ring(cx, cy, rx, ry, c, n, inner, skipBelow, only){
  n = n || 2.4; inner = inner || 1;
  for (let y = -ry; y <= ry; y++){
    if (skipBelow && y > 0) continue;
    for (let x = -rx; x <= rx; x++){
      if (only === 'lr' && (x + y) < 1) continue;   // lower-right: shade
      if (only === 'ul' && (x + y) > -1) continue;  // upper-left: light
      const o = Math.pow(Math.abs(x/rx), n) + Math.pow(Math.abs(y/ry), n);
      const i = Math.pow(Math.abs(x/Math.max(1, rx - inner)), n) +
                Math.pow(Math.abs(y/Math.max(1, ry - inner)), n);
      if (o <= 1 && i > 1) px(cx + x, cy + y, c);
    }
  }
}
/* ordered 2x2 dither between two palette colours — the only gradient allowed */
const DITH = [[1,0],[0,1]];
function ditherRect(x, y, w, h, a, b){
  for (let j=0;j<h;j++) for (let i=0;i<w;i++)
    px(x+i, y+j, DITH[j & 1][i & 1] ? a : b);
}
/* anything drawn inside withOutline() gets a 1px edge for free — and the edge is the
   material's OWN darker tone, not one ink for everything. That single line is the sheets'
   outline logic, and it is why the world now reads as the same hand as the character. */
function withOutline(fn){
  maskOn = true; fn(); maskOn = false;
  const edge = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    if (!mask[y*W+x]) continue;
    if (!(x>0 && mask[y*W+x-1]) || !(x<W-1 && mask[y*W+x+1]) ||
        !(y>0 && mask[(y-1)*W+x]) || !(y<H-1 && mask[(y+1)*W+x])) edge.push(y*W+x);
  }
  for (const i of edge) fb[i] = INKD[fb[i]] === undefined ? INK : INKD[fb[i]];
  mask.fill(0);
}
function tw(str, sc){ sc = sc || 1; return str.length * 6 * sc - sc; }
function say(str, x, y, c, sc){
  sc = sc || 1; str = String(str).toUpperCase();
  for (let n = 0; n < str.length; n++){
    const gl = G[str[n]] || BLOCK;
    for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++)
      if (gl[j][i] === '#') rect(x + n*6*sc + i*sc, y + j*sc, sc, sc, c);
  }
  return x + tw(str, sc);
}
function sayShadow(str, x, y, c, sc){ say(str, x+1, y+1, INK, sc); say(str, x, y, c, sc); }
function blit(){
  if (!img) return;
  const d = img.data;
  for (let i = 0, p = 0; i < W*H; i++, p += 4){
    const v = fb[i];
    const hex = v < NPAL ? PAL[v] : (activeSkin.pal[v - NPAL] || '#000000');
    d[p]   = parseInt(hex.slice(1,3), 16);
    d[p+1] = parseInt(hex.slice(3,5), 16);
    d[p+2] = parseInt(hex.slice(5,7), 16);
    d[p+3] = 255;
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(off, 0, 0, W, H, 0, 0, W*VIEW, H*VIEW);
}

/* ------------------------------------------------- 10b. the mascot sprites
   RLE: digits are a run length; the single character after them is the colour, a letter
   indexing SKIN_PAL, or '.' for transparent. Letters only - with digits as colours the
   format is ambiguous and '2 2 3 6 .' re-reads as one run of 2236. */
function decodePoses(raw){
  const out = {};
  for (const name in raw){
    const p = raw[name], rows = [];
    for (const s of p.rows){
      const row = [];
      let i = 0;
      while (i < s.length){
        let j = i;
        while (j < s.length && s[j] >= '0' && s[j] <= '9') j++;
        const n = j > i ? parseInt(s.slice(i, j), 10) : 1;
        const ch = s[j];
        /* lowercase from 0, uppercase continues from 26 — a 32-colour ramp needs past 'z' */
        const v = ch === '.' ? 255
                : (ch >= 'a' && ch <= 'z') ? ch.charCodeAt(0) - 97
                : ch.charCodeAt(0) - 65 + 26;
        for (let k = 0; k < n; k++) row.push(v);
        i = j + 1;
      }
      rows.push(row);
    }
    out[name] = { w: p.w, h: p.h, rows };
  }
  return out;
}
/* Skins. One sheet = one entry, each with its own ten-colour ramp so the sprite is never
   forced onto the world palette. To add one:
     python3 tools/import_sprites.py <sheet.png> --var NAME --names ... --out /tmp/NAME.js
   splice the block in beside the others and add a single line to the registry. */
const SKINS = {
  muse:   { label: 'muse',   pal: SKIN_PAL,   poses: decodePoses(SKIN_POSES)   },
  hermi:  { label: 'hermi',  pal: HERMI_PAL,  poses: decodePoses(HERMI_POSES)  },
  clawie: { label: 'clawie', pal: CLAWIE_PAL, poses: decodePoses(CLAWIE_POSES) },
  groki:  { label: 'groki',  pal: GROKI_PAL,  poses: decodePoses(GROKI_POSES)  },
};
let activeSkinKey = 'muse';
let activeSkin = SKINS.muse;
function setSkin(name){
  const s = SKINS[name];
  if (!s) return false;
  activeSkin = s; activeSkinKey = name;
  return true;
}
function skinNames(){ return Object.keys(SKINS); }

/* Which pose it wears is the whole emotional surface of the toy: it is surprised when it
   has something to ask, it turns its back after being left waiting, it looks away when it
   has been denied a lot, and it cheers when you agree with it.

   The two thresholds here are MEASURED, not chosen. Over 12,000-tick runs across four
   owner styles the trust ceiling is 57.0 (attentive) and the autonomy floor is 22.0
   (deny-spam) - so `trust > 70` and `autonomy < 20` were both unreachable and those two
   poses never fired once. A pose that cannot be reached is not an emotion. Probes:
   /tmp/probe_poses_all.js fires all twelve only with the corrected numbers. */
function mascotPose(s){ return petPose(s); }   // the pet's mood decides the pose (see petPose)
function drawMascot(s, x, y){
  const pose = activeSkin.poses[mascotPose(s)];
  if (!pose) return false;
  const bob = s.asleep ? 0 : (Math.floor(s.tick/14) % 2);
  for (let j = 0; j < pose.h; j++){
    const row = pose.rows[j];
    if (!row) continue;
    for (let i = 0; i < pose.w; i++){
      const v = row[i];
      /* typeof guard, not just a range check: pointing this at the undecoded RLE strings
         made row[i] a character, and '6' + 16 is the string "616" - 104 once it lands in
         the Uint8Array. It drew garbage for a whole round of testing. */
      if (typeof v !== 'number' || v === 255) continue;
      px(x + i, y + j - bob, v + NPAL);       // NPAL+ indexes the sprite sub-palette
    }
  }
  return true;
}

/* ------------------------------------------------------ 10c. the fallback
   Only reached if the sprite data failed to parse - a game about a pet should still have
   a pet on screen. Not the shipped look. */
const MASCOT_SIZE = [ {rx:9,  ry:13, fw:5,  fh:6  },
                      {rx:11, ry:16, fw:6,  fh:7  },
                      {rx:13, ry:18, fw:7,  fh:8  },
                      {rx:15, ry:20, fw:8,  fh:9  } ];

function drawMuse(s, cx, baseY){
  const st = s.form ? 3 : s.stage;
  const Z = MASCOT_SIZE[st];
  const breathe = (Math.floor(s.tick/18) % 2);
  const hop = (s.play || s.call) ? (Math.floor(s.tick/5) % 2) : (Math.floor(s.tick/14) % 2);
  const wriggle = s.call ? (Math.floor(s.tick/6) % 2 ? 1 : -1) : 0;
  const ry = Z.ry - breathe;
  const cy = baseY - ry - (s.call || s.asleep ? 0 : hop);
  const fx = cx + wriggle;
  const fy = cy - Math.round(Z.fh * 0.5);            // the face sits high in the blob
  withOutline(() => {
    /* The fleece stays MID-tone. The face is lighter than the fleece and sits inside a
       darker recess - that value order is what makes it read as a hood rather than a
       face pasted on an egg. (v3 had the fleece lighter than the face: no separation.) */
    egg(cx, cy, Z.rx, ry, FUR_B, 2.4);
    ring(cx, cy, Z.rx, ry, FUR_D, 2.4, 2, false, 'lr');   // shade: lower-right
    ring(cx, cy, Z.rx, ry, FUR_L, 2.4, 1, false, 'ul');   // light: upper-left
    ring(cx, cy + ry - 3, Math.max(3, Z.rx - 2), 3, FUR_D, 2.2, 1, false);   // contact shade
    /* a fluffy edge: single-pixel tufts on the upper silhouette, inside the mask so the
       outline traces around them rather than around each tuft */
    for (let i = 0; i < 22; i++){
      const a = (i / 22) * Math.PI * 2, tuft = (i % 2) ? 2 : 1;
      const bx = cx + Math.round((Z.rx + tuft - 1) * Math.cos(a));
      const by = cy + Math.round((ry + tuft - 1) * Math.sin(a) * 0.92);
      px(bx, by, (i % 2) ? FUR_L : FUR_B);
      if (i % 4 === 0) px(bx + 1, by, FUR_L);
    }
    /* the hood: a two-pixel recess, a 1px fabric brow, and the face sunk inside it */
    egg(fx, fy + 2, Z.fw + 3, Z.fh + 3, FUR_D, 2.4);
    ring(fx, fy + 1, Z.fw + 2, Z.fh + 2, FUR_D, 2.4, 1);                     // dark rim, all round
    ring(fx, fy - 1, Z.fw + 2, Z.fh + 2, FUR_B, 2.4, 1, true);               // the brow
    /* the face: light in the middle, shaded where the hood casts down onto it — the cast
       shadow is the cue that was missing; a rim alone reads as a sticker */
    egg(fx, fy + 1, Z.fw, Z.fh, FACE_S, 2.4);
    egg(fx, fy, Z.fw, Z.fh, FACE, 2.4);
    ring(fx, fy - 1, Math.max(2, Z.fw - 1), Math.max(2, Z.fh - 1), FACE_S, 2.4, 1, true);
    egg(fx - 1, fy - 1, Math.max(1, Z.fw - 4), Math.max(1, Z.fh - 5), FACE_L, 2.4);
    /* eyes: solid dots with a catchlight, set wide */
    const ey = fy - 1, ex = Math.max(3, Math.round(Z.fw * 0.62));
    const happy = s.happy > 70;
    if (s.asleep || (s.tick % 46) < 3){
      hline(fx - ex - 1, fx - ex + 1, ey + 1, EYE);
      hline(fx + ex - 1, fx + ex + 1, ey + 1, EYE);
    } else if (happy){
      px(fx - ex - 1, ey + 2, EYE); px(fx - ex, ey + 1, EYE); px(fx - ex + 1, ey + 2, EYE);
      px(fx + ex - 1, ey + 2, EYE); px(fx + ex, ey + 1, EYE); px(fx + ex + 1, ey + 2, EYE);
    } else {
      rect(fx - ex - 1, ey, 3, 3, EYE);
      rect(fx + ex - 1, ey, 3, 3, EYE);
      px(fx - ex - 1, ey, WHITE); px(fx + ex - 1, ey, WHITE);
    }
    /* a wide, unmistakable U */
    px(fx - 3, ey + 5, EYE); px(fx + 3, ey + 5, EYE);
    px(fx - 2, ey + 6, EYE); px(fx + 2, ey + 6, EYE);
    hline(fx - 1, fx + 1, ey + 7, EYE);
    /* blush, soft-edged */
    rect(fx - ex - 3, ey + 5, 4, 3, FACE_S);
    rect(fx - ex - 2, ey + 5, 3, 3, BLUSH);
    rect(fx + ex, ey + 5, 4, 3, FACE_S);
    rect(fx + ex + 1, ey + 5, 3, 3, BLUSH);
    /* grown-up accessories, worn on the body since it has no hands */
    if (s.form === 'STEWARD'){
      hline(cx - 5, cx + 5, cy + Math.floor(Z.fh/2) + 4, GOLD);
      px(cx, cy + Math.floor(Z.fh/2) + 5, GOLD);
    } else if (s.form === 'PROSPECTOR'){
      for (let i = -4; i <= 4; i++) px(cx + i, cy + 4 + i, FUR_D);
      rect(cx + 3, cy + 8, 5, 4, GOLD);
      px(cx + 5, cy + 9, FUR_D);
    } else if (s.form === 'CLERK'){
      hline(cx - 6, cx + 6, cy + Math.floor(Z.fh/2) + 4, WHITE);
      px(cx, cy + Math.floor(Z.fh/2) + 5, FUR_D);
    }
  });
}

/* ------------------------------------------------------- 11. the world */
function drawSky(s){
  const night = isNight(s.tick);
  if (night){
    rect(0, 0, W, 96, INK);
    ditherRect(0, 34, W, 40, INK, INK2);
    for (let i = 0; i < 22; i++){
      const x = (i * 37 + 11) % W, y = (i * 53 + 7) % 40;
      px(x, y, (Math.floor(s.tick/8) + i) % 3 < 1 ? PURE : SKY_L);
    }
    disc(128, 22, 8, SKY_L); disc(124, 19, 7, INK);           // moon
  } else {
    rect(0, 0, W, 96, SKY);
    ditherRect(0, 26, W, 22, SKY, SKY_L);                      // soft horizon
    disc(128, 22, 8, GOLD); disc(130, 20, 5, GOLD_L); disc(125, 25, 3, GOLD_D);
  }
  const drift = Math.floor(s.tick / 3) % (W + 60);
  const cloud = (bx, by, k) => {
    withOutline(() => {
      disc(bx, by, k, PURE);
      disc(bx + k, by + 1, k - 1, PURE);
      disc(bx - k, by + 1, k - 1, PURE);
      hline(bx - k*2, bx + k*2, by + 2, PURE);
      hline(bx - k*2, bx + k*2, by + 3, night ? INK2 : SKY_L);
    });
  };
  cloud(((20 - drift) + W + 60) % (W + 60) - 30, 16, 4);
  cloud(((96 - Math.floor(drift*0.6)) + W + 60) % (W + 60) - 30, 30, 3);
}
function drawGround(s){
  const g = 96;
  rect(0, g, W, H - g, GREEN);
  ditherRect(0, g, W, 5, GREEN, GREEN_L);                      // sunlit edge
  ditherRect(0, H - 12, W, 12, GREEN, GREEN_D);                // shade toward the viewer
  for (let i = 0; i < 22; i++){
    const x = (i * 29 + 5) % W, y = g + 9 + ((i * 17) % 30);

    if (i % 5 === 0){ px(x + 2, y, BLUSH); px(x + 2, y - 1, GOLD_L); }    // the sheets' flowers
  }
  rect(0, H - 4, W, 4, GREEN_D);
  hline(0, W - 1, H - 5, GREEN_INK);
}
function drawBush(x, gy){

    disc(x, gy - 16, 11, GREEN_D);
    disc(x - 5, gy - 12, 8, GREEN);

function drawMess(s){

function drawEffects(s){

  }
  if (s.asleep){
    for (let i = 0; i < 3; i++){

      px(x, y, RED); px(x+1, y, RED); px(x-1, y+1, RED); px(x+2, y+1, RED);

    const bw = 92, bx = Math.round((W - bw) / 2), by = 96;
    withOutline(() => {
      rect(bx, by, bw, 11, CREAM_L);
      rect(bx + 1 + Math.round(0.32 * (bw - 2)), by + 2, Math.round(0.36 * (bw - 2)), 7, GREEN_L);
      rect(bx + 1 + Math.round(0.29 * (bw - 2)), by + 8, Math.round(0.42 * (bw - 2)), 1, GREEN_D);
    });
    const mx = bx + 2 + Math.round(s.play.pos * (bw - 5));

function firstHint(s){
  /* "Nobody has touched this yet" is inputs.length === 0 — the log already says it, so the save grows no
     field and there is nothing to keep in step. Returns '' for every other case, which is what makes the
     lesson stop the moment it has been learned. */
  if (!s || s.gone || s.inputs.length) return '';
  const needs = [['hungry', s.hunger, 'the bowl'], ['bored', s.happy, 'the ball'],
                 ['tired', s.energy, 'the light'], ['dirty', s.clean, 'the brush']];
  needs.sort((a, b) => a[1] - b[1]);
  return needs[0][2] + ' is lowest';
}

/* ---- feedback: derived from fields that already exist ------------------------------------------------
   log() sets s.lastLog / s.lastLogAt and growth sets s.grownAt, so "what just happened and how long ago"
   needs no new state and cannot alter a replay: a flourish that could change the creature would break
   determinism, which is exactly why it is derived rather than stored. */
function fxAge(s, kind){
  if (kind === 'grow') return s.grownAt ? s.tick - s.grownAt : Infinity;
  if (s.lastLog !== kind) return Infinity;
  if (kind === 'note' || kind === 'q') chirp(s, s.lastLogText || '');
  if (kind === 'grow') playSfx('grow', 0.55);
  if (kind === 'sick') playSfx('critical', 0.4);
  return s.tick - s.lastLogAt;
}
function fxOpen(s, kind, window){
  const a = fxAge(s, kind);
  return a >= 0 && a <= window;
}
function drawFx(s){
  if (!s || s.gone || s.asleep) return;
  const p = petPose(s);
  const bx = (p && p.x !== undefined) ? p.x : 72, by = (p && p.y !== undefined) ? p.y : 76;
  if (fxOpen(s, 'grow', 12)){
    for (let i = 0; i < 12; i++){
      const a = i / 12 * Math.PI * 2;
      px(Math.round(bx + 14 + Math.cos(a) * 10), Math.round(by + 8 + Math.sin(a) * 6), CREAM_L);
      px(Math.round(bx + 14 + Math.cos(a) * 12), Math.round(by + 8 + Math.sin(a) * 7), SKY_L);
    }
    return;
  }
  const kinds = [['feed', 3, 4, CREAM_L], ['snack', 3, 4, CREAM_L], ['sweets', 3, 5, SKY_L],
                 ['play', 4, 6, INK], ['clean', 3, 5, INK], ['pet', 2, 5, BLUSH], ['medicine', 3, 5, BLUSH]];
  for (const [kind, win, n, colour] of kinds){
    if (!fxOpen(s, kind, win)) continue;
    const age = fxAge(s, kind);
    for (let i = 0; i < n; i++) px(bx + 14 + ((i * 7 + kind.length) % 9) - 4, by - 2 - age - (i % 2), colour);
    break;
  }
  if ((s.call || formEffect(s, 'call')) && s.lights){
    px(bx + 14, by - 6, BLUSH); px(bx + 13, by - 5, BLUSH); px(bx + 15, by - 5, BLUSH);
  }
}

/* ---- the switch --------------------------------------------------------------------------------------
   Off by default, and NOT persisted: the save holds exactly one localStorage key (rules P4/P6), so mute
   lives in memory for the session. Stated rather than quietly violated. */
let sound = false, soundCtx = null;

/* the form is DERIVED, never stored: a field that could disagree with the log is a field that
   can lie, and this body is built not to. Every read goes through formFor(s). */
function formOf(s){ return formFor(s); }
let s_lastTick = 0, s_soundedAt = -1;
function soundLabel(){ return 'sound: ' + (sound ? 'on' : 'off') + '  music: ' + (musicOn ? 'on' : 'off'); }
function toggleSound(on){ sound = (on === undefined) ? !sound : !!on;
  if (sound && sfxCtxOrDie() && sfxCtx.state === 'suspended') sfxCtx.resume();
  if (!sound && musicOn) setMusic(false);
  return sound; }
const SOUND_FOR = { feed: 660, snack: 700, sweets: 720, play: 880, hit: 900, clean: 520, pet: 440,
                    medicine: 600, grow: 990, close: 330, note: 380, q: 640, full: 380, rest: 300,
                    grumpy: 300, wake: 560, sleep: 300, sick: 260, notsick: 620, starve: 240,
                    nothing: 340, poop: 300 };

function soundTick(s){
  /* Driven from the RENDER path, never from log(): log() also runs during a replay, and a replayed pet
     must not chirp. A kind with no note is silent on purpose - a default note would make every unmapped
     event sound like every other one. */
  if (!sound || !s || s.gone) return;
  if (typeof speed !== 'undefined' && speed !== 1) return;
  if (s.lastLogAt === undefined || s.lastLogAt === s_soundedAt) return;
  s_soundedAt = s.lastLogAt;
  playTone(SOUND_FOR[s.lastLog] || 0, 0.09);
}

function playTone(freq, dur){
  if (!freq || !sound) return;
  try {
    if (typeof AudioContext === 'undefined' || !AudioContext) return;
    if (!soundCtx) soundCtx = new AudioContext();
    const o = soundCtx.createOscillator(), g = soundCtx.createGain();
    o.type = 'square'; o.frequency.value = freq; g.gain.value = 0.03;
    o.connect(g); g.connect(soundCtx.destination);
    o.start(); o.stop(soundCtx.currentTime + dur);
  } catch (e) { /* audio may never break the game */ }
}

/* ---- sound: effects from files, music if you brought any -----------------------------------------------
   The one-file rule is retired (operator, 2026-09-25): depth is worth more than a 404KB artefact. So
   effects are real files at real quality, and the game is written to be UNHAPPY without them: a file that
   404s is silence, never an error, because a toy that refuses to start over a missing wav is not a toy.
   What did not go: the game makes no network call. Files BESIDE it are a different thing from a fetch,
   and that is what keeps it runnable offline with no server. */
const SFX_FILES = { feed: 'feed', snack: 'snack', play: 'play', hit: 'hit', clean: 'clean', pet: 'pet',
                    medicine: 'medicine', lights: 'lights', poop: 'poop', grow: 'grow',
                    critical: 'critical', asleep: 'asleep' };
const MUSIC_FILES = { kitchen: 'kitchen', daylight: 'daylight', dawn: 'dawn', evening: 'evening',
                      firelight: 'firelight', rain: 'rain', snowfall: 'snowfall', midnight: 'midnight' };

const sfxCache = {}, clipSaid = {};
const VOICE_CLIPS_UNDEFINED = (typeof VOICE_CLIPS === 'undefined');
let sfxCtx = null, musicEl = null, musicOn = false, musicRoom = '', chirpCtxVar = null;
function chirpCtx(){ if (!chirpCtxVar){ chirpCtxVar = sfxCtxOrDie(); } return chirpCtxVar; }

function sfxCtxOrDie(){
  if (sfxCtx) return sfxCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  sfxCtx = new AC();
  return sfxCtx;
}

function playSfx(kind, volume){
  const name = SFX_FILES[kind];
  if (!sound || !name) return;
  const src = 'audio/sfx/' + name + '.mp3';
  try {
    if (sfxCache[kind]){ const b = sfxCache[kind].cloneNode(); b.volume = volume === undefined ? 0.5 : volume;
                         b.play(); return; }
    const a = new Audio(src);
    a.volume = volume === undefined ? 0.5 : volume;
    a.addEventListener('canplaythrough', function(){ sfxCache[kind] = a; }, { once: true });
    a.addEventListener('error', function(){ /* absent audio is silence, not a fault */ }, { once: true });
    a.play().catch(function(){});
  } catch (e) { /* a sound that will not play must never break the pet */ }
}

function roomFor(s){
  /* A pure function of the pet's state, which is the only reason a music picker can be tested at all.
     It never reads the caretaker's clock: a pet left alone overnight drifts to midnight by itself, and a
     pet being neglected gets firelight rather than something cheerful. */
  if (!s) return 'kitchen';
  const critical = s.hunger < 20 || s.happy < 20 || s.clean < 25 || s.health < 40;
  const lowish   = s.hunger < 45 || s.happy < 45 || s.clean < 50 || s.health < 60;
  if (s.asleep) return s.day <= 2 ? 'snowfall' : 'midnight';
  if (s.lights === false) return critical ? 'firelight' : 'evening';
  if (critical) return 'firelight';
  if (s.day <= 1) return 'dawn';
  if (lowish) return 'rain';
  if (s.happy >= 70 && s.hunger >= 70) return 'kitchen';
  return 'daylight';
}

function setMusic(on){
  musicOn = (on === undefined) ? !musicOn : !!on;
  if (!musicOn){ if (musicEl){ musicEl.pause(); } return musicOn; }
  if (musicEl) musicEl.play().catch(function(){});
  return musicOn;
}

function musicFor(s){
  if (!musicOn) return;
  const room = roomFor(s);
  if (room === musicRoom) return;
  musicRoom = room;
  const file = MUSIC_FILES[room];
  if (!file) return;
  try {
    if (!musicEl){ musicEl = new Audio(); musicEl.loop = true; musicEl.volume = 0.22;
                   musicEl.addEventListener('error', function(){}, { once: true }); }
    musicEl.src = 'audio/music/' + file + '.mp3';
    musicEl.play().catch(function(){});   /* no music folder: silence, and the game carries on */
  } catch (e) { /* music may never break the pet */ }
}

/* ---- animalese: the pet's own voice, and it costs nothing ---------------------------------------------
   One short pitched blip per character, the way Animal Crossing does it, with the pitch derived from the
   SEED - so two creatures sound different and the same creature is always itself, with no stored audio and
   no network. Rendered, not simulated: pitch comes from mulberry32 keyed on the seed and NEVER from s.rng,
   because a redraw that consumed the simulation's stream would land on a different pet and break replay.
   That is the same rule petLine() already obeys, and the reason it is written here in full. */
let chirpBase = 0;
function chirpPitch(s){
  /* the creature's register: derived once per seed, so it never drifts within a life and never changes
     between two creatures. 300-560Hz keeps it in the range a small square wave can carry. */
  const r = mulberry32(((s.seed >>> 0) ^ 0x9e3779b9) >>> 0);
  return 300 + Math.floor(r() * 260);
}
function chirp(s, text){
  if (!sound || !s || s.gone || !text) return;
  if (typeof speed !== 'undefined' && speed !== 1) return;   // fast-forward is not a performance
  const ctx = chirpCtx();
  if (!ctx) return;
  if (chirpBase !== chirpPitch(s)) chirpBase = chirpPitch(s);
  const clean = String(text).replace(/[^A-Za-z0-9 ,.!?'-]/g, '');
  const n = Math.min(clean.length, 24);                      // a long line is a long line, not a lecture
  if (!n) return;
  const r = mulberry32(((s.seed >>> 0) ^ 0x85ebca6b ^ s.tick) >>> 0);
  let t = ctx.currentTime + 0.01;
  const step = 0.055;
  for (let i = 0; i < n; i++){
    const ch = clean[i];
    if (ch === ' ' || ch === ',' || ch === '.'){ t += step; continue; }
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = chirpBase * (0.86 + r() * 0.34);    // each blip varies a little
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.05);
    } catch (e) { /* a voice that will not sing must never break the pet */ }
    t += step;
  }
}


/* ---- the long game: what a grown pet becomes, chosen by how it was kept ---------------------------
   Not by elapsed days. The four forms are a fold over the log - which the pet already keeps - so this
   costs no new state and cannot alter a replay. The caretaker does not choose; the pet ends up somewhere
   because of the care it actually received, and none of the four is better than the others. A DRIFTER is
   not a failure state, it is a pet nobody made a project of. */
const FORM_NAME = { STEWARD: 'a steward', PROSPECTOR: 'a prospector', CLERK: 'a clerk', DRIFTER: 'a drifter' };

function formFor(s){
  if (!s || s.stage < 3) return null;          // nothing has a form before it is fully grown
  let clean = 0, play = 0, fed = 0;
  for (const l of (s.log || [])){
    if (l.kind === 'clean') clean++;
    else if (l.kind === 'play' || l.kind === 'hit') play++;
    else if (l.kind === 'feed' || l.kind === 'snack') fed++;
  }
  /* ties broken toward routine, because a pet that was kept consistently is a pet with habits, and a
     habit is what a form is. The order is fixed so the same log always yields the same form. */
  if (clean >= 6) return 'STEWARD';
  if (play >= 8) return 'PROSPECTOR';
  if (fed >= 8)  return 'CLERK';
  if (clean + play + fed >= 4) return 'CLERK';
  return 'DRIFTER';
}


/* ---- what a form does ------------------------------------------------------------------------------
   A label the caretaker can read is a badge; a label that changes what the pet does is a life. Each
   effect is small, visible, and derived, so none of it can desynchronise from the log either. */
function formEffect(s, kind){
  const f = (typeof formOf === 'function') ? formOf(s) : null;
  if (!f || !sound) return false;
  if (f === 'STEWARD'    && kind === 'mess')  return s.clean > 92;   // it tidies after itself
  if (f === 'PROSPECTOR' && kind === 'awake') return s.happy > 80;   // it is restless and pleased
  if (f === 'CLERK'      && kind === 'turn')  return true;           // the day reads out in its voice
  if (f === 'DRIFTER'    && kind === 'call')  return s.happy < 35;   // it asks, more often
  return false;
}

function drawScreen(s){
  fb.fill(0);
  drawSky(s);
  drawGround(s);
  drawBush(16, 106);
  drawHome(136, 100, s);
  drawMess(s);
  if (screen === 'pet') drawFx(s);
  if (screen === 'door'){
    /* The front door. Drawn over the room rather than instead of it, so the first thing anyone sees is
       where the creature lives. The name is the game's own — seeds pick it — so the title introduces
       somebody rather than a product. */
    fb.fill(0);
    drawSky(s); drawGround(s); drawBush(16, 106); drawHome(136, 100, s);
    sayShadow('MUSEGOTCHI', 48, 54, SKY_L, 1);
    sayShadow(s.name.toUpperCase(), 48, 68, SKY_L, 1);
    sayShadow('PRESS ANYTHING', 20, 90, SKY_L, 1);
    blit(); return;
  }
  if (screen === 'pet' && firstHint(s)){
    /* teach by doing: the lowest need names itself, once, on the first run only */
    sayShadow(firstHint(s).toUpperCase(), 12, 130, SKY_L, 1);
  }
  if (screen === 'lost'){
    /* the card is an ending and the egg is a beginning, so the screen behind the card is the
       room with nobody in it rather than the new pet already standing there */
    sayShadow('NOBODY HERE', 40, 62, SKY_L, 1);
    blit(); return;
  }
  if (s.gone){
    ditherRect(0, 0, W, H, INK, INK2);
    sayShadow(s.name + ' IS GONE', 26, 46, CREAM_L, 1);
    sayShadow(s.cause === 'hungry' ? 'TOO HUNGRY, TOO LONG' : 'NOBODY BROUGHT MEDICINE', 4, 66, BLUSH, 1);
    sayShadow('IT LIVED ' + s.day + (s.day === 1 ? ' DAY' : ' DAYS'), 34, 86, SKY_L, 1);
    blit(); return;
  }
  const baseY = 120;
  /* the mascot is imported at 3 source pixels per sprite pixel and drawn 1:1 on the grid, so
     it stands ~100px tall in a 144px screen - the pet is the subject and the meadow is the
     backdrop. Feet anchored 2px above the box floor: 28 + (110-2) = 136. */
  if (!(Object.keys(activeSkin.poses).length >= 12 && drawMascot(s, 22, s.asleep ? 30 : 28))) drawMuse(s, 56, baseY);
  drawEffects(s);
  sayShadow((s.name || 'MUSE'), 4, 4, WHITE);
  /* the plate blinks beside the name while it is asking for something — the tamagotchi beep,
     with no sound to it */
  /* the call mark beside the name. A bare pixel read as a stray artifact in an outside read —
     it is a blinking '!' now, which is the thing a tamagotchi actually shows. */
  if (s.call && (Math.floor(s.tick / 30) % 2))
    sayShadow('!', 6 + tw(s.name || 'MUSE', 1), 2, RED_L, 1);
  blit();
}
function stageLabel(s){
  const f = (typeof formOf === 'function') ? formOf(s) : (s.form || null);
  if (f) return f;
  return ['TINY','SCOUT','OPERATOR'][s.stage] || 'OPERATOR';
}

/* -------------------------------------------------------- 12. DOM surface */
/* The page is a pet's page: four needs, what it is asking for, and what happened today.
   Nothing here counts tokens or asks permission. */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let screen = 'door', S = null, speed = 1, inputPtr = 0, showRaw = false;

function hearts(val, colour){
  /* drawn from the same 8x8 heart bitmap as every other icon. The ♥/♡ glyphs were system-font
     curves with anti-aliased tips sitting inside a pixel card. */
  const n = Math.round(clamp(val, 0, 100) / 20);
  let out = '';
  for (let i = 0; i < 5; i++)
    out += '<span style="color:' + (i < n ? colour : 'var(--cream3)') + ';opacity:' +
      (i < n ? 1 : .45) + '" data-px="icon" data-icon="heart" data-scale="3"></span>';
  return out;
}
function statRow(icon, name, val, colour){
  return '<div class="stat">' +
    '<span class="ic" style="color:' + colour + '" data-px="icon" data-icon="' + icon + '" data-scale="3"></span>' +
    '<span class="nm">' + ptext(name, 2) + '</span>' +
    '<span class="hx">' + hearts(val, colour) + '</span></div>';
}
function moodWord(s){
  if (s.gone) return 'gone';
  if (s.sick) return 'poorly';
  const n = need(s);
  /* the only place company is legible on the page, and it is a word about the pet, not a meter */
  if (!n && s.company < CFG.COMPANY_LOW) return 'watching you';
  return n === 'starve' ? 'starving' : n === 'hungry' ? 'hungry' : n === 'sleepy' ? 'sleepy' :
         n === 'dirty' ? 'grubby' : (n === 'bored' || n === 'lonely') ? 'bored' :
         s.happy > 72 ? 'happy' : 'all right';
}
function renderHud(){
  const s = S;
  if (!s) return;
  $('whohead').innerHTML = ptext(s.gone ? s.name + ' is gone' : 'how ' + s.name + ' is feeling', 2);
  $('hud').innerHTML =
    statRow('bowl', 'tummy', s.hunger, 'var(--gold3)') +
    statRow('heart', 'spirits', s.happy, 'var(--red)') +

/* The diary's collapse rule, out of the render so the suite can ask about it. A repeated line folds
   into an `xN`; a RECORD line folds ACROSS days, because the day can turn many times in one open
   sitting - an in-world day is six real minutes at the default speed - and Mikey's ruling is one
   line carrying the count of days, never an itemized bill for a window the caretaker already paid
   for (musebook 59792). The count is a floor rather than a total: the log keeps 30 lines, so a very
   long sitting saturates it and the row says so. */
function collapsedLines(log){
  const out = [];
  for (const l of log){
    const record = l.kind === 'q' && l.text.indexOf('nobody answered') >= 0;
    const last = out[out.length - 1];
    if (last && last.text === l.text && (last.d === l.d || record)){
      last.n++; last.floor = record; continue;
    }
    out.push({ t: l.t, d: l.d, text: l.text, n: 1, floor: record });
  }
  return out;
}

/* the two canvases that show the pet's own art: the picker chips and the card portrait */
function paintPose(cv, key, poseName, S_){
  const sk = SKINS[key]; if (!sk) return false;
  const pose = sk.poses[poseName] || sk.poses.idle; if (!pose) return false;
  const D = 2;
  cv.width = S_ * D; cv.height = S_ * D;
  const g = cv.getContext && cv.getContext('2d'); if (!g) return false;
  if (g.imageSmoothingEnabled !== undefined) g.imageSmoothingEnabled = false;
  let top = pose.h, x0 = pose.w, x1 = 0;
  for (let j = 0; j < pose.h; j++){
    const row = pose.rows[j]; if (!row) continue;
    for (let i = 0; i < pose.w; i++){
      const v = row[i];
      if (typeof v === 'number' && v !== 255){
        if (j < top) top = j;
        if (i < x0) x0 = i;
        if (i > x1) x1 = i;
      }
    }
  }
  const cx = Math.round((x0 + x1) / 2);
  const ox = Math.max(0, Math.min(pose.w - S_, cx - (S_ >> 1)));
  const oy = Math.max(0, Math.min(pose.h - S_, top));
  for (let j = 0; j < S_; j++){
    const row = pose.rows[oy + j]; if (!row) continue;
    for (let i = 0; i < S_; i++){
      const v = row[ox + i];
      if (typeof v !== 'number' || v === 255) continue;
      g.fillStyle = sk.pal[v];
      g.fillRect(i * D, j * D, D, D);
    }
  }
  return true;
}

let inputs = [], cursor = 0;

     touch on a title screen would quietly spend itself on a creature they have not met yet */
  if (screen === 'door'){
    screen = 'pet';
    renderAll();
    return;
  }
